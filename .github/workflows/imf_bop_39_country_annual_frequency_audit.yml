name: IMF BOP 39-country annual-frequency exact-series reachability audit
on:
  push:
    branches:
      - research/imf-bop-access-audit-v1
    paths:
      - ".github/workflows/imf_bop_39_country_annual_frequency_audit.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imf-bop-39-country-annual-frequency-audit
  cancel-in-progress: false
jobs:
  annual_reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test exact portfolio-flow series at annual frequency without changing quarterly evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p imf-bop-39-country-annual-audit
          python - <<'PY'
          import urllib.request,urllib.error,hashlib,json,csv,math
          from pathlib import Path
          from datetime import datetime,timezone
          from urllib.parse import urlencode
          out=Path("imf-bop-39-country-annual-audit")
          matrix=list(csv.DictReader(open("data/research/imf_bop_emde_43_cross_period_matrix_20261114.csv",encoding="utf-8")))
          targets=sorted(r["BOP_COUNTRY_CODE"] for r in matrix if r["CROSS_PERIOD_STATUS"]=="NO_OBSERVATIONS_IN_EITHER_TESTED_WINDOW")
          if len(targets)!=39 or len(set(targets))!=39: raise SystemExit("Expected exact 39-country unresolved set from verified cross-period matrix")
          cross=list(csv.DictReader(open("data/research/imf_weo_emde_to_bop_country_crosswalk_2026_04.csv",encoding="utf-8")))
          names={r["BOP_COUNTRY_CODE"]:r["WEO_EMDE_NAME"] for r in cross}
          if not set(targets)<=set(names): raise SystemExit("Target absent from validated 154-country crosswalk")
          base="https://api.imf.org/external/sdmx/3.0/data/dataflow/IMF.STA/BOP/21.0.0/"
          cases=[{"name":"assets_annual_2000_2025","key":"*.A_NFA_T.P_F.USD.A","entry":"A_NFA_T"},{"name":"liabilities_annual_2000_2025","key":"*.L_NIL_T.P_F.USD.A","entry":"L_NIL_T"}]
          def parse(body,entry):
            obj=json.loads(body); ds=obj["data"]["dataSets"][0]; st=obj["data"]["structures"][0]
            sd=st.get("dimensions",{}).get("series",[]); od=st.get("dimensions",{}).get("observation",[])
            ids=[x.get("id") for x in sd]
            if ids!=["COUNTRY","BOP_ACCOUNTING_ENTRY","INDICATOR","UNIT","FREQUENCY"]: raise ValueError("Unexpected series dimensions "+repr(ids))
            if [x.get("id") for x in od]!=["TIME_PERIOD"]: raise ValueError("Unexpected observation dimensions")
            periods=[x.get("value") for x in od[0].get("values",[])]
            if not periods or any(not str(p).isdigit() for p in periods): raise ValueError("Annual TIME_PERIOD dimension is absent or not YYYY: "+repr(periods[:10]))
            reporters={}; empty=[]
            series=ds.get("series",{})
            if not isinstance(series,dict): raise ValueError("Series container is not an object")
            for sk,so in series.items():
              ix=[int(x) for x in sk.split(":")]
              if len(ix)!=len(sd): raise ValueError("Series key arity mismatch")
              kv={sd[i]["id"]:sd[i]["values"][ix[i]].get("id",sd[i]["values"][ix[i]].get("value")) for i in range(len(ix))}
              if kv["BOP_ACCOUNTING_ENTRY"]!=entry or kv["INDICATOR"]!="P_F" or kv["UNIT"]!="USD" or kv["FREQUENCY"]!="A": raise ValueError("Unexpected series key "+repr(kv))
              country=kv["COUNTRY"]; obs=so.get("observations",{}); seen=[]
              for ok,ov in obs.items():
                oi=int(ok)
                if oi>=len(periods) or not ov or ov[0] is None or not math.isfinite(float(ov[0])): raise ValueError("Invalid observation value/index")
                seen.append(str(periods[oi]))
              if not seen: empty.append(country); continue
              if len(seen)!=len(set(seen)): raise ValueError("Duplicate annual period "+country)
              reporters[country]={"count":len(seen),"periods":sorted(seen),"first":min(seen),"last":max(seen),"series_attributes":so.get("attributes",[])}
            return {"reporters":reporters,"empty":sorted(empty),"series_count":len(series),"periods":periods}
          results=[]
          for case in cases:
            query=urlencode({"dimensionAtObservation":"TIME_PERIOD","attributes":"all","detail":"dataonly","limit":"10000"})
            url=base+case["key"]+"?"+query
            req=urllib.request.Request(url,headers={"User-Agent":"PRECISION-WIRES-V11.3-research/1.0","Accept":"application/vnd.sdmx.data+json;version=2.0.0"})
            try:
              with urllib.request.urlopen(req,timeout=150) as r: status=r.status; headers=dict(r.headers.items()); final=r.geturl(); body=r.read(); error=None
            except urllib.error.HTTPError as e: status=e.code; headers=dict(e.headers.items()) if e.headers else {}; final=e.geturl(); body=e.read(); error="HTTPError"
            except Exception as e: status=None; headers={}; final=url; body=b""; error=type(e).__name__+": "+str(e)
            (out/(case["name"]+".body")).write_bytes(body)
            parsed={"reporters":{},"empty":[],"series_count":0,"periods":[],"error":None}
            if status==200 and "json" in headers.get("Content-Type","").lower():
              try: parsed=parse(body,case["entry"])
              except Exception as e: parsed["error"]=type(e).__name__+": "+str(e)
            rows=[]
            for code in targets:
              v=parsed["reporters"].get(code)
              rows.append({"BOP_COUNTRY_CODE":code,"WEO_EMDE_NAME":names[code],"SERIES":case["entry"],"FREQUENCY":"A","PERIOD_WINDOW":"2000-2025 (locally filtered from complete annual response)","STATUS":"OBSERVATIONS_FOUND" if v else ("EMPTY_SERIES_KEY" if code in parsed["empty"] else "NO_SERIES_KEY_RETURNED"),"OBSERVATION_COUNT":v["count"] if v else 0,"FIRST_PERIOD":v["first"] if v else "","LAST_PERIOD":v["last"] if v else "","OBSERVED_PERIODS":";".join(v["periods"]) if v else ""})
            with open(out/(case["name"]+"_39_country_matrix.csv"),"w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0]),lineterminator="\n"); w.writeheader(); w.writerows(rows)
            rec={"name":case["name"],"requested_url":url,"period_filter":"No server-side TIME_PERIOD filter; local observation filter 2000-2025","series_key":case["key"],"http_status":status,"content_type":headers.get("Content-Type"),"final_url":final,"transport_error":error,"bytes":len(body),"sha256":hashlib.sha256(body).hexdigest(),"retrieved_at_utc":datetime.now(timezone.utc).isoformat(),"parse_ok":parsed.get("error") is None and bool(parsed.get("periods")),"parse_error":parsed.get("error"),"returned_series_count":parsed["series_count"],"target_reporters_with_observations":sum(c in parsed["reporters"] for c in targets),"target_empty_series_keys":sorted(set(targets)&set(parsed["empty"])),"target_no_series_keys":sorted(set(targets)-set(parsed["reporters"])-set(parsed["empty"])),"target_reporters":{c:parsed["reporters"][c] for c in targets if c in parsed["reporters"]}}
            (out/(case["name"]+".json")).write_text(json.dumps(rec,indent=2,ensure_ascii=False)+"\n"); results.append(rec)
          summary={"dataset":"IMF.STA:BOP(21.0.0)","dsd":"IMF.STA:DSD_BOP(24.0.0)","indicator":"P_F","unit":"USD","frequency":"A","period_range":"2000-2025 (locally filtered; complete annual response requested)","target_definition":"39 codes marked NO_OBSERVATIONS_IN_EITHER_TESTED_WINDOW in prior quarterly matrix","target_codes":targets,"target_count":len(targets),"results":[{k:r[k] for k in ("name","http_status","bytes","sha256","parse_ok","parse_error","returned_series_count","target_reporters_with_observations","target_empty_series_keys","target_no_series_keys")} for r in results],"acceptance":{"both_requests_http_200_and_parse":all(r["http_status"]==200 and r["parse_ok"] for r in results),"both_queries_return_nonzero_series":all(r["returned_series_count"]>0 for r in results),"exact_target_set_39":len(targets)==39,"no_aggregation":True,"quarterly_evidence_unchanged":True}}
          (out/"summary.json").write_text(json.dumps(summary,indent=2,ensure_ascii=False)+"\n"); print(json.dumps(summary,indent=2,ensure_ascii=False))
          if not summary["acceptance"]["both_requests_http_200_and_parse"] or not summary["acceptance"]["both_queries_return_nonzero_series"]: raise SystemExit("Annual reachability test failed; preserve evidence and do not infer eligibility")
          PY
      - name: Upload raw responses and 39-country annual matrices
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imf-bop-39-country-annual-audit-${{ github.run_id }}
          path: imf-bop-39-country-annual-audit/
          if-no-files-found: error
          retention-days: 90
