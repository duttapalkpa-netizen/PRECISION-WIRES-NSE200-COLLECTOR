name: WEO October 2026 EMDE Membership Capture
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research/weo_oct2026_membership_trigger.txt"
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Capture official WEO October 2026 workbook
        run: python scripts/research/capture_weo_oct2026_emde_membership.py
      - name: Upload raw workbook and provenance
        uses: actions/upload-artifact@v4
        with:
          name: weo-oct2026-emde-membership-${{ github.run_id }}
          path: weo_oct2026_emde_membership/
          if-no-files-found: error
          retention-days: 90
