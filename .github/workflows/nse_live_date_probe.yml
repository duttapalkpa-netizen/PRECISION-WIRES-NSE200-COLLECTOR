name: NSE Live Date Probe

on:
  push:
    paths:
      - ".github/workflows/nse_live_date_probe.yml"
  pull_request:
    paths:
      - ".github/workflows/nse_live_date_probe.yml"

permissions:
  contents: read

concurrency:
  group: nse-live-date-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe official NSE sources (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request, urllib.error, zipfile
          from datetime import datetime
          from pathlib import Path

          expected = "2026-11-13"
          stamp = "13112026"
          ymd = "20261113"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/130 Safari/537.36",
              "Accept": "text/csv,application/zip,*/*",
              "Referer": "https://www.nseindia.com/",
          }
          urls = {
              "full_delivery": f"https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_{stamp}.csv",
              "udiff": f"https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_{ymd}_F_0000.csv.zip",
              "legacy": f"https://archives.nseindia.com/products/content/sec_bhavdata_full_{stamp}.csv",
          }
          report = {"expected_trade_date": expected, "mode": "read_only", "results": []}
          aliases = {"DATE1","DATE","TRADDT","TRADING_DATE","TRADINGDATE","TRADE_DATE","TRADEDATE"}
          for source, url in urls.items():
              item = {"source": source, "url": url}
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as response:
                      raw = response.read()
                      item.update(http_status=response.status, bytes=len(raw),
                                  content_type=response.headers.get("Content-Type",""))
                  if raw[:2] == b"PK":
                      with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                          csv_names = [n for n in archive.namelist() if n.lower().endswith(".csv")]
                          if not csv_names:
                              raise ValueError("ZIP contains no CSV")
                          name = max(csv_names, key=lambda n: archive.getinfo(n).file_size)
                          data = archive.read(name).decode("utf-8-sig", errors="replace")
                          item["member"] = name
                  else:
                      data = raw.decode("utf-8-sig", errors="replace")
                  reader = csv.DictReader(io.StringIO(data))
                  fields = {str(x or "").strip().upper().replace(" ","").replace("-","").replace("_","") for x in (reader.fieldnames or [])}
                  date_aliases = {x.replace("_","") for x in aliases}
                  date_field = next((x for x in (reader.fieldnames or []) if str(x or "").strip().upper().replace(" ","").replace("-","").replace("_","") in date_aliases), None)
                  series_field = next((x for x in (reader.fieldnames or []) if str(x or "").strip().upper() in ("SERIES","SCTYSRS")), None)
                  if not date_field or not series_field:
                      item.update(status="BLOCKED", reason="required date/series column missing")
                  else:
                      eq_dates = set()
                      invalid = 0
                      eq_count = 0
                      for row in reader:
                          if str(row.get(series_field,"")).strip().upper() != "EQ":
                              continue
                          eq_count += 1
                          raw_date = str(row.get(date_field,"")).strip()
                          parsed = None
                          for fmt in ("%Y-%m-%d","%Y%m%d","%d%m%Y","%d-%m-%Y","%d/%m/%Y","%d-%b-%Y"):
                              try:
                                  parsed = datetime.strptime(raw_date,fmt).date().isoformat()
                                  break
                              except ValueError:
                                  pass
                          if parsed is None:
                              invalid += 1
                          else:
                              eq_dates.add(parsed)
                      item.update(eq_rows=eq_count, invalid_dates=invalid, embedded_dates=sorted(eq_dates))
                      item["status"] = "PASS" if eq_count and invalid == 0 and eq_dates == {expected} else "BLOCKED"
              except urllib.error.HTTPError as exc:
                  item.update(status="BLOCKED", http_status=exc.code, reason="HTTP error")
              except Exception as exc:
                  item.update(status="BLOCKED", reason=f"{type(exc).__name__}: {exc}")
              report["results"].append(item)
          statuses = [x["status"] for x in report["results"]]
          report["overall"] = "PASS" if "PASS" in statuses else "BLOCKED"
          Path("nse_live_date_probe.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-live-date-probe-20261113
          path: nse_live_date_probe.json
          if-no-files-found: warn
          retention-days: 30
