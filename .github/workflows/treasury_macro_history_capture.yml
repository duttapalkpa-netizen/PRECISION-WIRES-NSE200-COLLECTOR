name: Treasury Macro History Capture (Nominal + Real)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/research/treasury_macro_capture_trigger.txt"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture official Treasury paginated XML histories
        run: python scripts/research/capture_treasury_yield_history.py
      - name: Upload raw pages, manifest, normalized observations and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-macro-history-${{ github.run_id }}
          path: treasury_macro_evidence/
          if-no-files-found: warn
          retention-days: 90
