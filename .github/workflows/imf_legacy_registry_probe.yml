name: IMF Legacy BOP Artefact Registry Probe
on:
  push:
    paths:
      - "scripts/research/probe_imf_legacy_registry_ids.py"
      - "scripts/research/imf_legacy_registry_probe_trigger.txt"
      - ".github/workflows/imf_legacy_registry_probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe exact legacy IDs on public SDMX Central
        run: python scripts/research/probe_imf_legacy_registry_ids.py
      - name: Archive raw responses and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imf-legacy-registry-probe-${{ github.run_id }}
          path: imf_legacy_registry_probe/
          if-no-files-found: error
          retention-days: 90
