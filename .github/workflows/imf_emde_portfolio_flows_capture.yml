name: IMF BOP WEO EMDE Portfolio Flows Capture
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research/imf_emde_portfolio_flows_trigger.txt"
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install openpyxl
      - name: Capture WEO membership and IMF BOP EMDE panel
        run: python scripts/research/capture_imf_emde_portfolio_flows.py
      - name: Upload raw sources, panel and coverage
        uses: actions/upload-artifact@v4
        with:
          name: imf-bop-emde-portfolio-flows-${{ github.run_id }}
          path: imf_emde_portfolio_flows/
          if-no-files-found: error
          retention-days: 90
