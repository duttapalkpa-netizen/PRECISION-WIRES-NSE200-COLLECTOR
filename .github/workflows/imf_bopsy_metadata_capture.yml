name: IMF BOPSY Official Metadata Capture
on:
  push:
    branches: [research/imf-bopsy-public-metadata-20261119]
    paths:
      - "scripts/research/imf_bopsy_capture_trigger.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF parser
        run: pip install pypdf==5.9.0
      - name: Capture official IMF BOPSY notes and reporting coverage
        run: python scripts/research/capture_imf_bopsy_2025_notes.py
      - name: Upload immutable source capture
        uses: actions/upload-artifact@v4
        with:
          name: imf-bopsy-2025-official-notes-${{ github.run_id }}
          path: imf_bopsy_2025_official_notes/
          if-no-files-found: error
          retention-days: 90
