name: Global capital rotation overlay research tests
on:
  pull_request:
    paths:
      - "pipeline/global_capital_rotation_overlay.py"
      - "qa/test_global_capital_rotation_overlay.py"
      - "docs/GLOBAL_CAPITAL_ROTATION_OVERLAY_V1.md"
      - "data/global_capital_rotation/**"
      - ".github/workflows/global_capital_rotation_overlay_tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest qa.test_global_capital_rotation_overlay -v
