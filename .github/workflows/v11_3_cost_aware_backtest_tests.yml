name: V11.3 Research-Only Cost-Aware Backtest Tests

on:
  push:
    paths:
      - "pipeline/v11_3_cost_aware_backtest.py"
      - "pipeline/forward_outcome_integrity.py"
      - "tests/research/test_v11_3_cost_aware_backtest.py"
      - "tests/research/test_forward_outcome_integrity.py"
      - ".github/workflows/v11_3_cost_aware_backtest_tests.yml"
  pull_request:
    paths:
      - "pipeline/v11_3_cost_aware_backtest.py"
      - "tests/research/test_v11_3_cost_aware_backtest.py"
      - ".github/workflows/v11_3_cost_aware_backtest_tests.yml"

permissions:
  contents: read

concurrency:
  group: v11-3-cost-aware-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal numerical dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run isolated research replay tests
        run: python -m unittest discover -s tests/research -p "test_*.py" -v
