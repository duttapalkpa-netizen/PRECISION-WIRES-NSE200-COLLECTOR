name: Audit-only Corrected Target Label Walk-Forward

on:
  workflow_dispatch:
  push:
    branches: [audit/corrected-forward-targets]

permissions:
  contents: read

jobs:
  corrected-label-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/corrected-forward-targets
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regression tests for forward-only labels
        run: python -m unittest discover -s qa -p "test_*.py" -v
      - name: Acquire normalized NSE history
        run: python collector/nse_download.py --sessions 200
      - name: Build normalized adaptive dataset
        run: python collector/build_200_sessions.py
      - name: Strict dataset QA
        run: python qa/validate_dataset.py
      - name: Run corrected-label walk-forward refit (audit only)
        env:
          WF_SESSIONS: "100"
        run: python pipeline/walk_forward_backtest.py
      - name: Run precision-constrained Top-30 recovery experiment (audit only)
        run: python pipeline/precision_constrained_recovery.py
      - name: Upload audit-only results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corrected-target-label-audit
          path: |
            data/qa/
            outputs/backtest/walk_forward_metrics.json
            outputs/backtest/walk_forward_predictions.csv
            outputs/backtest/walk_forward_universe_probabilities.csv
            outputs/backtest/missed_winner_lab.csv
            outputs/backtest/feature_ablation_effects.csv
            outputs/backtest/precision_constrained_recovery_daily.csv
            outputs/backtest/precision_constrained_recovery_comparison.csv
            outputs/backtest/precision_constrained_recovery_summary.json
            outputs/backtest/behavioral_dna_library.json
          if-no-files-found: warn
