name: BCB Domestic Portfolio Release Vintage Extraction
on:
  push:
    branches:
      - research/bcb-priority-metadata-audit-20261117
    paths:
      - 'scripts/research/extract_bcb_domestic_portfolio_release_vintage.py'
      - '.github/workflows/bcb_domestic_portfolio_release_vintage_extract.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XLSX reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Extract exact release rows and headers
        run: python scripts/research/extract_bcb_domestic_portfolio_release_vintage.py
      - name: Commit evidence extract
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/qa/BCB_DOMESTIC_PORTFOLIO_RELEASE_VINTAGE_EXTRACT_20261117.json
          if git diff --cached --quiet; then echo "No evidence change."; else
            git commit -m "qa: extract exact domestic portfolio release vintage values"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcb-domestic-portfolio-release-vintage-extract
          path: data/qa/BCB_DOMESTIC_PORTFOLIO_RELEASE_VINTAGE_EXTRACT_20261117.json
          if-no-files-found: warn
          retention-days: 90
