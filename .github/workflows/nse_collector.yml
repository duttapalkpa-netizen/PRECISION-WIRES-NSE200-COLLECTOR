name: NSE Historical Backbone + Adaptive V11.3 + IPO-PLX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "scripts/research/nic_concordance_parser.py"
      - "tests/research/test_nic_concordance_parser.py"
      - "tests/research/test_nic_concordance_source_acquisition.py"
      - ".github/workflows/nic_concordance_parser_tests.yml"
      - "scripts/research/acquire_nic_concordance_source.py"
      - ".github/workflows/nic_concordance_source_acquisition.yml"
      - ".github/workflows/nse_collector.yml"
      - ".github/workflows/imf_sdmx_rss_registration_audit.yml"
      - "scripts/research/imf_audit_trigger.txt"
      - ".github/workflows/imf_registry_transaction_resolver.yml"
      - "scripts/research/imf_registry_transaction_resolver.py"
      - "scripts/research/imf_transaction_resolver_trigger.txt"
      - ".github/workflows/treasury_macro_history_capture.yml"
      - "scripts/research/capture_treasury_yield_history.py"
      - "scripts/research/treasury_macro_capture_trigger.txt"
      - "scripts/research/capture_imf_weo_oct2026_membership_source.py"
      - "scripts/research/imf_weo_membership_capture_trigger.txt"
      - ".github/workflows/imf_brazil_public_api_probe.yml"
      - ".github/workflows/imf_bop_public_route_probe.yml"
      - "scripts/research/imf_bop_public_route_probe_trigger.txt"
      - "scripts/research/probe_imf_brazil_public_api.py"
      - "scripts/research/probe_imf_brazil_registration_batch.py"
      - "scripts/research/probe_imf_brazil_exact_registration.py"
      - "scripts/research/capture_imf_brazil_registration_lifecycle.py"
      - "scripts/research/validate_imf_brazil_history_against_global_index.py"
      - "scripts/research/capture_weo_emde_membership.py"
      - "scripts/research/capture_weo_oct2026_membership.py"
      - "scripts/research/weo_emde_capture_trigger.txt"
      - ".github/workflows/weo_emde_membership_capture.yml"
      - "scripts/research/probe_imf_bop_portal_download_route.py"
      - "scripts/research/imf_bop_portal_route_probe_trigger.txt"
      - ".github/workflows/imf_bop_dsd_v260_capture.yml"
      - "scripts/research/capture_imf_bop_dsd_v260.py"
      - "scripts/research/imf_bop_dsd_v260_capture_trigger.txt"
      - ".github/workflows/weo_oct2026_membership_capture.yml"\n      - ".github/workflows/imf_weo_oct2026_membership_capture.yml"\n      - ".github/workflows/persist_imf_emde_panel.yml"\n      - "scripts/research/persist_imf_emde_panel_trigger.txt"\n      - "scripts/research/capture_imf_weo_oct2026_membership_source.py"\n      - "scripts/research/imf_weo_membership_capture_trigger.txt"
      - "scripts/research/capture_weo_oct2026_emde_membership.py"
      - "scripts/research/weo_oct2026_membership_trigger.txt"
      - ".github/workflows/imf_emde_portfolio_flows_capture.yml"
      - "scripts/research/capture_imf_emde_portfolio_flows.py"
      - "scripts/research/imf_emde_portfolio_flows_trigger.txt"
      - ".github/workflows/imf_emde_sample_validation.yml"
      - "scripts/research/validate_imf_emde_panel_sample.py"
      - "scripts/research/imf_emde_sample_validation_trigger.txt"
      - ".github/workflows/persist_imf_emde_panel.yml"
      - "scripts/research/persist_imf_emde_panel_trigger.txt"

      - "scripts/research/probe_imf_bop_public_routes.py"
      - "scripts/research/fetch_imf_bop_dsd_codelists.py"
      - "scripts/research/smoke_test_imf_bop_observations.py"
      - "scripts/research/probe_imf_bop_broad_observation_queries.py"
      - "scripts/research/capture_imf_bop_portfolio_panel.py"
      - "scripts/research/validate_imf_bop_portfolio_panel.py"
      - "scripts/research/probe_imf_scale_concept_routes.py"
      - "scripts/research/imf_bop_scale_semantics_trigger.txt"
      - ".github/workflows/imf_bop_scale_semantics.yml"
      - "scripts/research/resolve_imf_bop_scale_semantics.py"
      - "scripts/research/probe_imf_brazil_pa_structure_revision.py"
      - ".github/workflows/imf_bop_portal_route_probe.yml"
      - "scripts/research/imf_brazil_public_api_probe_trigger.txt"
      - ".github/workflows/nse_cancel_accidental_probe_run.yml"
      - "scripts/research/nse_cancel_accidental_probe_trigger.txt"
  schedule:
    - cron: "30 4 * * 1-5"

permissions:
  contents: read

jobs:
  collect-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Acquire 200 NSE market sessions
        run: python collector/nse_download.py --sessions 200
      - name: Acquire NSE Security Master
        continue-on-error: true
        run: python collector/security_master.py
      - name: Build normalized adaptive dataset
        run: python collector/build_200_sessions.py
      - name: Strict QA
        run: python qa/validate_dataset.py
      - name: 100-session leakage-safe V11.3 walk-forward behavioural backtest
        env:
          WF_SESSIONS: "100"
        run: python pipeline/walk_forward_backtest.py
      - name: Adaptive V11.3 A/B/C/D/E technical core + behavioural ranking
        run: python pipeline/v11_3_abcd_e.py
      - name: IPO-PLX V2.0 early-listing engine
        run: python pipeline/ipo_plx_v2.py
      - name: Acquire Macro + FII/DII + Geo context
        run: python collector/context_data.py
      - name: Acquire Live 1m candidate feed
        continue-on-error: true
        run: python collector/live_1m.py
      - name: Risk modifier
        run: python pipeline/risk_modifier.py
      - name: Build full 56x12 = 672 diagnostic matrix
        run: python pipeline/diagnostics_672.py
      - name: Deterministic 30-10-3 final selection + readiness gate
        run: python pipeline/final_selection.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precision-wires-adaptive-${{ github.run_number }}
          path: |
            data/processed/
            data/reference/
            data/context/
            data/live/
            data/qa/
            outputs/finalists/
            outputs/diagnostics/
            outputs/ipo_plx/
            outputs/backtest/
          if-no-files-found: warn
