name: NSE Historical Backbone + Adaptive V11.3 + IPO-PLX

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "30 4 * * 1-5"

permissions:
  contents: read

jobs:
  collect-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Acquire 200 NSE market sessions
        run: python collector/nse_download.py --sessions 200
      - name: Acquire NSE Security Master
        continue-on-error: true
        run: python collector/security_master.py
      - name: Build normalized adaptive dataset
        run: python collector/build_200_sessions.py
      - name: Strict QA
        run: python qa/validate_dataset.py
      - name: Adaptive V11.3 A/B/C/D/E technical core
        run: python pipeline/v11_3_abcd_e.py
      - name: IPO-PLX V2.0 early-listing engine
        run: python pipeline/ipo_plx_v2.py
      - name: Risk modifier
        run: python pipeline/risk_modifier.py
      - name: Deterministic provisional 30-10-3 selection + readiness gate
        run: python pipeline/final_selection.py
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: precision-wires-adaptive-${{ github.run_number }}
          path: |
            data/processed/
            data/reference/
            data/qa/
            outputs/finalists/
            outputs/ipo_plx/
          if-no-files-found: warn
