name: Macro-Geo Archive Contract Regression (Audit Only)

on:
  push:
    branches: [audit/prospective-selector-tracking]
    paths:
      - ".github/workflows/macro_geo_archive_contract_regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macro-geo-archive-contract-regression
  cancel-in-progress: false

jobs:
  archive-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: audit/prospective-selector-tracking
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test runner
        run: python -m pip install pytest

      - name: Run network-free producer-consumer contract regression
        run: |
          set -euo pipefail
          python -m pytest -q qa/test_macro_geo_archive_report_contract.py

      - name: Write machine-readable regression evidence
        if: always()
        run: |
          python - <<'PY'
          import ast, hashlib, json
          from pathlib import Path
          source_path = Path("pipeline/macro_geo_collect_p0.py")
          test_path = Path("qa/test_macro_geo_archive_report_contract.py")
          source = source_path.read_bytes()
          test = test_path.read_bytes()
          tree = ast.parse(source.decode("utf-8"))
          producer_keys, consumer_keys = set(), set()
          for node in ast.walk(tree):
              if isinstance(node, ast.FunctionDef) and node.name == "nse_index_history":
                  for child in ast.walk(node):
                      if isinstance(child, ast.Return) and isinstance(child.value, ast.Tuple):
                          report = child.value.elts[1]
                          if isinstance(report, ast.Dict):
                              producer_keys.update(k.value for k in report.keys
                                  if isinstance(k, ast.Constant) and isinstance(k.value, str))
              if isinstance(node, ast.Subscript) and isinstance(node.value, ast.Name) and node.value.id == "archive_report":
                  key = node.slice
                  if isinstance(key, ast.Constant) and isinstance(key.value, str):
                      consumer_keys.add(key.value)
          required = {"observed_session_requests", "rows", "failures"}
          result = {
              "schema_version": 1,
              "scope": "network-free AST producer/consumer contract only",
              "producer_keys": sorted(producer_keys),
              "consumer_keys": sorted(consumer_keys),
              "required_producer_keys_present": sorted(required & producer_keys) == sorted(required),
              "observed_session_requests_consumed": "observed_session_requests" in consumer_keys,
              "stale_weekday_requests_consumer_absent": "weekday_requests" not in consumer_keys,
              "collector_sha256": hashlib.sha256(source).hexdigest(),
              "test_sha256": hashlib.sha256(test).hexdigest(),
              "status": "PASS" if required <= producer_keys and "observed_session_requests" in consumer_keys and "weekday_requests" not in consumer_keys else "FAIL"
          }
          out = Path("outputs/macro_geo/archive_report_contract_validation.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(result, indent=2) + "\n")
          print(out.read_text())
          if result["status"] != "PASS":
              raise SystemExit(1)
          PY

      - name: Upload bounded regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-geo-archive-contract-regression
          path: outputs/macro_geo/archive_report_contract_validation.json
          if-no-files-found: error
          compression-level: 6
