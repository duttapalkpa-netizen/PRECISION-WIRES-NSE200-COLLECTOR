name: Mexico IMF BOP Scale Reconciliation Evidence
on:
  push:
    paths:
      - "scripts/research/mexico_scale_reconciliation_trigger.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Capture Banxico and compare with IMF panel
        run: python scripts/research/reconcile_imf_bop_scale_mexico_banxico.py
      - name: Upload raw Banxico page and reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mexico-imf-banxico-scale-${{ github.run_id }}
          path: banxico_mexico_scale_reconciliation/
          if-no-files-found: error
          retention-days: 90
