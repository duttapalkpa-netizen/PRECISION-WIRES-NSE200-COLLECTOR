name: GNB IMF BOP Exact Series-Key Probe

on:
  push:
    branches: [main]
    paths:
      - "scripts/research/imf_bop_gnb_series_probe_trigger.txt"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe exact GNB annual and quarterly series keys
        run: python scripts/research/imf_bop_gnb_series_probe.py
      - name: Archive raw responses and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imf-gnb-bop-exact-series-probe
          path: imf_gnb_bop_probe/
          if-no-files-found: error
          retention-days: 90
