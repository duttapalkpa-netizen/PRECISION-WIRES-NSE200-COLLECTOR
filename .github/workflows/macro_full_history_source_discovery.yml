name: Official Macro Full History Source Discovery
on:
  push:
    branches: [fix/factor-registry-same-snapshot-reconcile]
    paths:
      - "pipeline/macro_full_history_source_discovery.py"
      - "pipeline/verify_oea_tls_chain.py"
      - "pipeline/collect_oea_wpi_itemwise.py"
      - "qa/test_oea_wpi_itemwise.py"
      - "qa/test_macro_full_history_source_discovery.py"
      - ".github/workflows/macro_full_history_source_discovery.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macro-full-history-source-discovery
  cancel-in-progress: false
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install openpyxl certifi
      - name: Run discovery guardrail tests
        run: python -m unittest qa.test_macro_full_history_source_discovery qa.test_oea_wpi_itemwise -v
      - name: Diagnose OEA TLS chain, hostname, DNS and HTTP redirect without bypass
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/macro_full_history_discovery/tls_diagnostics
          OUT=artifacts/macro_full_history_discovery/tls_diagnostics
          CA="$(python -c 'import certifi; print(certifi.where())')"
          for HOST in eaindustry.nic.in www.eaindustry.nic.in; do
            {
              echo "HOST=$HOST"
              date -u +%Y-%m-%dT%H:%M:%SZ
              echo "--- DNS ---"
              getent ahosts "$HOST" || true
              echo "--- OpenSSL verified chain and SAN ---"
              timeout 25 openssl s_client -connect "$HOST:443" -servername "$HOST" -showcerts -verify_return_error -CAfile "$CA" </dev/null 2>&1
              echo "--- Leaf certificate ---"
              timeout 25 openssl s_client -connect "$HOST:443" -servername "$HOST" -showcerts </dev/null 2>/dev/null | openssl x509 -noout -subject -issuer -serial -dates -fingerprint -sha256 -ext subjectAltName 2>&1
              echo "--- curl strict CA + hostname + redirects ---"
              timeout 35 curl --verbose --location --max-redirs 5 --cacert "$CA" --connect-timeout 10 --max-time 30 --output /dev/null --write-out 'HTTP=%{http_code} FINAL=%{url_effective} VERIFY=%{ssl_verify_result} REMOTE=%{remote_ip}\n' "https://$HOST/download_data_2223.asp" 2>&1
              echo "--- end host ---"
            } > "$OUT/$HOST.txt"
          done
          python - <<'PY'
          import json,ssl,socket,certifi,subprocess
          from pathlib import Path
          out=Path("artifacts/macro_full_history_discovery/tls_diagnostics")
          result={"ca_bundle":certifi.where(),"default_verify_paths":ssl.get_default_verify_paths()._asdict(),"hosts":{}}
          for host in ("eaindustry.nic.in","www.eaindustry.nic.in"):
              item={"dns":[]}
              try:item["dns"]=sorted({x[4][0] for x in socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)})
              except Exception as e:item["dns_error"]=repr(e)
              try:
                  ctx=ssl.create_default_context(cafile=certifi.where())
                  with socket.create_connection((host,443),timeout=10) as raw:
                      with ctx.wrap_socket(raw,server_hostname=host) as s:
                          cert=s.getpeercert()
                          item.update({"python_tls":"PASS","tls_version":s.version(),"cipher":s.cipher()[0],"subject":cert.get("subject"),"issuer":cert.get("issuer"),"san":cert.get("subjectAltName"),"notBefore":cert.get("notBefore"),"notAfter":cert.get("notAfter")})
              except Exception as e:item.update({"python_tls":"FAIL","python_tls_error":repr(e)})
              result["hosts"][host]=item
          (out/"tls_diagnostics.json").write_text(json.dumps(result,indent=2,default=str)+"\\n")
          print(json.dumps(result,indent=2,default=str))
          PY
      - name: Verify official YR1 chain and fetch OEA over strict TLS
        run: python pipeline/verify_oea_tls_chain.py
      - name: Discover official WPI, CGA, GDP and CPI historical source inventory
        run: python pipeline/macro_full_history_source_discovery.py
      - name: Download and extract official WPI item-wise monthly observations
        run: python pipeline/collect_oea_wpi_itemwise.py
      - name: Verify raw-source hashes and discovery manifest
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("artifacts/macro_full_history_discovery")
          d=json.loads((p/"source_inventory.json").read_text())
          x=d["sources"]["oea_wpi"]
          if x["status"]==200:
           raw=p/"oea_download_data_2223.html"
           assert hashlib.sha256(raw.read_bytes()).hexdigest()==x["sha256"]
          else:
           assert x["status"]=="SOURCE_TRANSPORT_BLOCKED" and x["link_count"]==0
          w=json.loads((p/"oea_wpi_itemwise_manifest.json").read_text())
          wraw=p/w["source"]["raw_file"]
          wcsv=p/w["normalized_csv"]["file"]
          assert w["status"]=="ITEMWISE_INGESTION_PASS"
          assert hashlib.sha256(wraw.read_bytes()).hexdigest()==w["source"]["raw_sha256"]
          assert hashlib.sha256(wcsv.read_bytes()).hexdigest()==w["normalized_csv"]["sha256"]
          assert w["workbook"]["observation_count"]==w["normalized_csv"]["rows"]>0
          assert w["workbook"]["item_key_count"]>0\n          x=d["sources"]["cga_dashboard"]
          raw=p/"CGA_Monthly_Accounts_Dashboard_February_2026.xlsm"
          assert hashlib.sha256(raw.read_bytes()).hexdigest()==x["sha256"]
          assert d["sources"]["cga_dashboard"]["sheet_count"]>0
          assert d["sources"]["mospi_nas"]["catalogue_records"]>0
          assert d["sources"]["mospi_cpi"]["catalogue_records"]>0
          print({"status":"DISCOVERY_PASS_WITH_SOURCE_BLOCKERS","WPI_status":d["sources"]["oea_wpi"]["status"],"WPI_links":d["sources"]["oea_wpi"]["link_count"],
           "CGA_sheets":d["sources"]["cga_dashboard"]["sheet_count"],
           "NAS_records":d["sources"]["mospi_nas"]["catalogue_records"],
           "CPI_records":d["sources"]["mospi_cpi"]["catalogue_records"]})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-macro-full-history-source-discovery
          path: artifacts/macro_full_history_discovery/
          if-no-files-found: warn
