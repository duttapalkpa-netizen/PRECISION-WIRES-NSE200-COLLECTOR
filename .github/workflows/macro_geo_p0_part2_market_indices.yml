name: P0 Collection Audit - Part 2 Benchmark Sector Volatility

on:
  workflow_dispatch:
  push:
    branches: [audit/run145-factor-registry-gap-audit]
    paths:
      - ".github/workflows/macro_geo_p0_part2_market_indices.yml"

permissions:
  contents: read

concurrency:
  group: macro-geo-p0-part2-market-indices
  cancel-in-progress: false

jobs:
  market-indices-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Restore validated NSE panel cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/processed/nse_eq_200_sessions.csv
            data/processed/symbol_session_coverage.csv
          key: macro-geo-nse200-${{ github.ref_name }}-part1-${{ github.run_id }}
          restore-keys: |
            macro-geo-nse200-${{ github.ref_name }}-
      - name: Collect bounded benchmark, sector and volatility smoke sample
        id: collect
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p data/external outputs/macro_geo
          python - <<'PY'
          import csv, json, time, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          panel = Path("data/processed/nse_eq_200_sessions.csv")
          report = {
              "part": "P0-2",
              "task": "bounded benchmark/sector/volatility source smoke sample",
              "checked_at_utc": datetime.now(timezone.utc).isoformat(),
              "status": "BLOCKED",
              "network_request_budget": 3,
              "results": [],
              "invariants": {
                  "production_selector_modified": False,
                  "RANKING_SCORE_modified": False,
                  "PRESSURE_FADE_modified": False,
                  "UNKNOWN_treated_as_negative": False
              }
          }
          if not panel.is_file():
              report["reason"] = "Part 1 canonical panel cache unavailable; refusing to use wall-clock dates or invent a date window"
          else:
              try:
                  with panel.open("r", encoding="utf-8-sig", newline="") as f:
                      reader = csv.DictReader(f)
                      cols = {str(c).strip().upper(): c for c in (reader.fieldnames or [])}
                      if "DATE" not in cols:
                          raise ValueError("DATE column missing from cached panel")
                      dates = sorted({(r.get(cols["DATE"]) or "").strip()[:10] for r in reader if (r.get(cols["DATE"]) or "").strip()})
                  if len(dates) < 200:
                      raise ValueError(f"expected >=200 unique panel sessions; got {len(dates)}")
                  start, end = dates[-200], dates[-1]
                  report["panel_window"] = {"first_session": start, "last_session": end, "unique_sessions": len(dates)}
                  # One request per series, fixed short timeout; no retry loops.
                  series = [
                      ("benchmark_index", "NIFTY 50", "%5ENSEI"),
                      ("sector_indices", "NIFTY IT", "%5ECNXIT"),
                      ("volatility", "INDIA VIX", "%5EINDIAVIX")
                  ]
                  rows = []
                  for group, label, symbol in series:
                      item = {"group": group, "series": label, "symbol": symbol, "status": "UNKNOWN"}
                      try:
                          p1 = int(datetime.fromisoformat(start).replace(tzinfo=timezone.utc).timestamp())
                          p2 = int((datetime.fromisoformat(end).replace(tzinfo=timezone.utc).timestamp())) + 86400
                          query = urllib.parse.urlencode({"period1": p1, "period2": p2, "interval": "1d"})
                          url = "https://query1.finance.yahoo.com/v8/finance/chart/" + symbol + "?" + query
                          req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0","Accept":"application/json"})
                          with urllib.request.urlopen(req, timeout=7) as response:
                              payload = json.loads(response.read().decode("utf-8"))
                              if response.status != 200:
                                  raise RuntimeError("HTTP " + str(response.status))
                          chart = payload.get("chart", {})
                          if chart.get("error"):
                              raise RuntimeError(str(chart["error"]))
                          results = chart.get("result") or []
                          if not results:
                              raise ValueError("empty chart result")
                          result = results[0]
                          timestamps = result.get("timestamp") or []
                          quote = ((result.get("indicators") or {}).get("quote") or [{}])[0]
                          closes = quote.get("close") or []
                          for ts, close in zip(timestamps, closes):
                              if close is None:
                                  continue
                              day = datetime.fromtimestamp(ts, timezone.utc).date().isoformat()
                              if start <= day <= end:
                                  rows.append({"DATE": day, "SERIES": label, "CLOSE": float(close),
                                    "SOURCE": "Yahoo Finance chart API (secondary proxy; not official NSE source)",
                                    "SOURCE_URL": url, "SOURCE_SYMBOL": symbol,
                                    "OBSERVED_AT_UTC": datetime.now(timezone.utc).isoformat(),
                                    "SOURCE_GROUP": group})
                          n = sum(1 for r in rows if r["SERIES"] == label)
                          if n:
                              item.update({"status":"OBSERVATIONS_RECEIVED", "rows":n, "first_date":min(r["DATE"] for r in rows if r["SERIES"]==label), "last_date":max(r["DATE"] for r in rows if r["SERIES"]==label)})
                          else:
                              raise ValueError("no usable closes in requested panel window")
                      except Exception as e:
                          item["error"] = type(e).__name__ + ": " + str(e)[:240]
                      report["results"].append(item)
                  out = Path("data/external/p0_part2_market_indices_smoke.csv")
                  with out.open("w", encoding="utf-8", newline="") as f:
                      writer = csv.DictWriter(f, fieldnames=["DATE","SERIES","CLOSE","SOURCE","SOURCE_URL","SOURCE_SYMBOL","OBSERVED_AT_UTC","SOURCE_GROUP"])
                      writer.writeheader()
                      writer.writerows(rows)
                  good = sum(1 for x in report["results"] if x["status"] == "OBSERVATIONS_RECEIVED")
                  report["observed_series"] = good
                  report["rows_written"] = len(rows)
                  report["status"] = "PASS" if good == 3 else "BLOCKED"
                  report["reason"] = "all three bounded source samples returned dated observations" if good == 3 else "one or more source samples failed; missing series remain UNKNOWN and are not imputed"
              except Exception as e:
                  report["reason"] = type(e).__name__ + ": " + str(e)[:300]
          Path("outputs/macro_geo/p0_part2_market_indices_report.json").write_text(json.dumps(report, indent=2) + "\\n", encoding="utf-8")
          print(json.dumps(report, indent=2))
          if report["status"] != "PASS":
              raise SystemExit(1)
          PY
      - name: Upload Part 2 report and source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-part2-market-indices
          path: |
            outputs/macro_geo/p0_part2_market_indices_report.json
            data/external/p0_part2_market_indices_smoke.csv
          if-no-files-found: warn
