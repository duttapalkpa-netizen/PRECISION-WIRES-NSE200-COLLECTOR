name: V11.3 Full-Universe Selection Quality Audit

on:
  push:
    branches:
      - research/v11-3-selection-quality-audit-20261115
    paths:
      - "scripts/research/analyze_v11_3_selection_quality.py"
      - ".github/workflows/v11_3_selection_quality_audit.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: v11-3-selection-quality-audit
  cancel-in-progress: true

jobs:
  selection-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal numerical dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Download immutable Run #16 evidence bundle
        uses: actions/download-artifact@v4
        with:
          name: v11-3-cutoff-safe-replay-16
          run-id: 43738312823
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - name: Run full-universe precision recall, missed-winner and cost-sensitivity audit
        run: |
          PYTHONPATH=. python scripts/research/analyze_v11_3_selection_quality.py \
            --data data/processed/nse_eq_200_sessions.csv \
            --candidates outputs/backtest/v11_3_historical_signals/v11_3_historical_calibration_audit.csv \
            --signals outputs/backtest/v11_3_historical_signals/v11_3_historical_signals_top30.csv \
            --trades outputs/backtest/v11_3_cost_aware_replay/cost_aware_trade_ledger.csv \
            --signal-manifest outputs/backtest/v11_3_historical_signals/v11_3_historical_signal_manifest.json \
            --out outputs/backtest/v11_3_selection_quality
      - name: Upload selection-quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: v11-3-selection-quality-audit-${{ github.run_number }}
          path: outputs/backtest/v11_3_selection_quality/
          if-no-files-found: error
          retention-days: 90
