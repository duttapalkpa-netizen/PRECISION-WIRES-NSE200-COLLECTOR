name: NSE Market Microstructure Factor Coverage Reconciliation
on:
  push:
    branches:
      - fix/factor-registry-same-snapshot-reconcile
    paths:
      - '.github/workflows/nse_market_microstructure_factor_reconciliation.yml'
      - 'pipeline/nse_market_microstructure_coverage_reconcile.py'
      - 'qa/test_nse_market_microstructure_coverage_reconcile.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: nse-market-microstructure-factor-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout conservative reconciliation code
        uses: actions/checkout@v4
        with:
          ref: fix/factor-registry-same-snapshot-reconcile
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install audit dependency
        run: python -m pip install 'pandas>=2.2,<3'
      - name: Download exact Factor Registry and 200-session microstructure artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/factor-base /tmp/microstructure
          gh run download 41589091809 -n sector-fundamentals-factor-registry-partial-reconciliation -D /tmp/factor-base
          gh run download 41591434468 -n nse-market-microstructure-200-session-partial-evidence -D /tmp/microstructure
          test -s /tmp/factor-base/outputs/macro_geo/source_coverage.json
          test -s /tmp/factor-base/outputs/macro_geo/factor_coverage_audit.csv
          test -s /tmp/microstructure/data/external/market_microstructure.csv
          test -s /tmp/microstructure/outputs/macro_geo/market_microstructure_200_session_qa.json
          python - <<'PY'
          import json,subprocess,os
          repo=os.environ['GITHUB_REPOSITORY']
          pins=[
           (41589091809,13208942888,'sha256:83b6b5352db701359b44b4b271a15b2617c794cc4972b8de9da01eedbf0213d6'),
           (41591434468,13210492158,'sha256:6113181222478d2e1c9debf6204c1cd19afc83c6ff5bef0349036991aa0a50a3')]
          for run,aid,digest in pins:
           r=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}'],text=True))
           assert r['conclusion']=='success',(run,r.get('conclusion'))
           arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts'],text=True))['artifacts']
           a=next(x for x in arts if x['id']==aid)
           assert a['digest']==digest and not a['expired'],a
           print({'run_id':run,'artifact_id':aid,'artifact_digest_verified':True})
          PY
      - name: Assemble exact evidence snapshot
        run: |
          set -euo pipefail
          mkdir -p data/external outputs/macro_geo
          cp /tmp/factor-base/outputs/macro_geo/source_coverage.json outputs/macro_geo/
          cp /tmp/microstructure/data/external/market_microstructure.csv data/external/
          cp /tmp/microstructure/outputs/macro_geo/market_microstructure_200_session_qa.json outputs/macro_geo/
      - name: Run conservative reconciliation regression tests
        run: python -m unittest -v qa.test_nse_market_microstructure_coverage_reconcile
      - name: Verify 200-session source evidence and reconcile without promotion
        run: |
          python pipeline/nse_market_microstructure_coverage_reconcile.py
          python pipeline/macro_geo_factor_coverage_audit.py
          python pipeline/factor_registry_gap_priority_audit.py
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          root=Path('outputs/macro_geo')
          cov=json.loads((root/'source_coverage.json').read_text())
          audit=json.loads((root/'factor_coverage_audit.json').read_text())
          priority=json.loads((root/'factor_gap_priority_audit.json').read_text())
          micro=next(x for x in cov['sources'] if x.get('source')=='market_microstructure')
          qa=json.loads((root/'market_microstructure_200_session_qa.json').read_text())
          assert qa['sessions']==200 and qa['panel_rows']==656703,qa
          assert qa['bhavcopy_sha256_revalidated_sessions']==200,qa
          assert micro['status']=='DATA_QUALITY_WARN' and micro['rows']==0 and micro['observed_rows']==656703,micro
          assert micro['circuit_status_unknown_rows']==656703
          assert micro['surveillance_status_unknown_rows']==656703
          assert micro['free_float_unknown_rows']==656703
          assert audit['factor_groups']==35
          assert audit['status']=='FACTOR_COVERAGE_AUDITED_WITH_GAPS'
          assert priority['recommended_first_source_group']=='global_freight_shipping'
          assert priority['not_connected_factors']==12 and priority['partial_factors']==23
          print(json.dumps({'microstructure_status':micro['status'],'hard_gate_rows':micro['rows'],
            'observed_rows':micro['observed_rows'],'factor_groups':audit['factor_groups'],
            'not_connected_factors':audit['not_connected'],'partial_factors':audit['partial_source_coverage'],
            'next_priority':priority['recommended_first_source_group'],
            'production_selector_changed':False,'ranking_score_changed':False,
            'pressure_fade_changed':False,'diagnostics_672_changed':False},indent=2))
          PY
      - name: Upload reconciled market microstructure and factor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-market-microstructure-factor-coverage-reconciliation
          path: |
            data/external/market_microstructure.csv
            outputs/macro_geo/market_microstructure_200_session_qa.json
            outputs/macro_geo/market_microstructure_source_coverage_reconciliation.json
            outputs/macro_geo/source_coverage.json
            outputs/macro_geo/factor_coverage_audit.csv
            outputs/macro_geo/factor_coverage_audit.json
            outputs/macro_geo/factor_gap_priority_audit.csv
            outputs/macro_geo/factor_gap_priority_audit.json
          if-no-files-found: warn
          retention-days: 90
