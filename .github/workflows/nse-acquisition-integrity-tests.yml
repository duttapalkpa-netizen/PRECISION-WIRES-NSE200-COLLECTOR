name: NSE Acquisition Integrity Tests

on:
  push:
    branches:
      - fix/factor-registry-same-snapshot-reconcile
    paths:
      - 'collector/nse_download.py'
      - 'tests/test_nse_acquisition_integrity.py'
      - 'tests/test_nse_bounded_retry.py'
      - '.github/workflows/nse-acquisition-integrity-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquisition-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install pandas requests
      - name: Run acquisition integrity tests
        run: python -m unittest -v tests.test_nse_acquisition_integrity tests.test_nse_bounded_retry
