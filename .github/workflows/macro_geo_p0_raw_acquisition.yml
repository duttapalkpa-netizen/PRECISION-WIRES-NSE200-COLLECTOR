name: Macro-Geo P0 bounded raw acquisition
on:
  push:
    branches:
      - fix/factor-registry-same-snapshot-reconcile
    paths:
      - '.github/workflows/macro_geo_p0_raw_acquisition.yml'
      - 'pipeline/macro_geo_p0_raw_collector.py'
      - 'research/config/macro_geo_p0_sources_2025-10-01_2025-10-10.json'
      - 'qa/test_macro_geo_p0_raw_collector.py'
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive source-data window (YYYY-MM-DD)"
        required: true
        default: "2025-10-01"
        type: string
      end_date:
        description: "Inclusive source-data window (YYYY-MM-DD)"
        required: true
        default: "2025-10-10"
        type: string
      sources_json:
        description: "JSON object with official HTTPS sources[] for all four P0 groups; optional archived_pairs[]"
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: macro-geo-p0-raw-acquisition
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate inputs and write source config
        env:
          SOURCES_JSON: ${{ inputs.sources_json }}
          START_DATE: ${{ inputs.start_date || '2025-10-01' }}
          END_DATE: ${{ inputs.end_date || '2025-10-10' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import date
          if os.environ["EVENT_NAME"] == "push":
              with open("research/config/macro_geo_p0_sources_2025-10-01_2025-10-10.json", encoding="utf-8") as f:
                  data=json.load(f)
          else:
              data=json.loads(os.environ["SOURCES_JSON"])
          assert isinstance(data,dict) and isinstance(data.get("sources"),list)
          date.fromisoformat(os.environ["START_DATE"]); date.fromisoformat(os.environ["END_DATE"])
          assert os.environ["START_DATE"] <= os.environ["END_DATE"]
          with open("macro_geo_p0_sources.json","w",encoding="utf-8") as f: json.dump(data,f)
          PY
      - name: Run collector fail-closed unit tests\n        run: |\n          python -m pip install pytest\n          pytest -q qa/test_macro_geo_p0_raw_collector.py\n      - name: Collect twice, hash, compare and preserve raw evidence
        run: |
          python pipeline/macro_geo_p0_raw_collector.py --config macro_geo_p0_sources.json --start-date "${{ inputs.start_date || '2025-10-01' }}" --end-date "${{ inputs.end_date || '2025-10-10' }}" --out macro_geo_p0_raw_evidence
      - name: Archive raw bytes and integrity ledger
        uses: actions/upload-artifact@v4
        with:
          name: macro-geo-p0-raw-evidence-2025-10-01-2025-10-10
          path: macro_geo_p0_raw_evidence/
          if-no-files-found: error
          retention-days: 90
