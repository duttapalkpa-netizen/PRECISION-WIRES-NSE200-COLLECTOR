name: Macro-Geo P0 bounded raw acquisition
on:
  push:
    branches:
      - fix/factor-registry-same-snapshot-reconcile
    paths:
      - '.github/workflows/macro_geo_p0_raw_acquisition.yml'
      - 'pipeline/macro_geo_p0_raw_collector.py'
      - 'qa/test_macro_geo_p0_raw_collector.py'
  workflow_dispatch:
    inputs:
      start_date:
        description: "Inclusive source-data window (YYYY-MM-DD)"
        required: true
        default: "2025-10-01"
        type: string
      end_date:
        description: "Inclusive source-data window (YYYY-MM-DD)"
        required: true
        default: "2025-10-10"
        type: string
      sources_json:
        description: "JSON object with distinct official HTTPS source URLs for all four P0 groups; optional archived_pairs[]"
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: macro-geo-p0-raw-acquisition
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed collector unit tests
        run: |
          python -m pip install pytest
          pytest -q qa/test_macro_geo_p0_raw_collector.py
  collect:
    if: github.event_name == 'workflow_dispatch'
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate inputs and write source config
        env:
          SOURCES_JSON: ${{ inputs.sources_json }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import date
          data=json.loads(os.environ["SOURCES_JSON"])
          assert isinstance(data,dict) and isinstance(data.get("sources"),list)
          date.fromisoformat(os.environ["START_DATE"]); date.fromisoformat(os.environ["END_DATE"])
          assert os.environ["START_DATE"] <= os.environ["END_DATE"]
          with open("macro_geo_p0_sources.json","w",encoding="utf-8") as f: json.dump(data,f)
          PY
      - name: Collect twice, validate, hash and compare
        run: |
          python pipeline/macro_geo_p0_raw_collector.py --config macro_geo_p0_sources.json --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" --out macro_geo_p0_raw_evidence
      - name: Archive raw bytes, hashes, validation and drift
        uses: actions/upload-artifact@v4
        with:
          name: macro-geo-p0-raw-evidence-${{ inputs.start_date }}-${{ inputs.end_date }}
          path: macro_geo_p0_raw_evidence/
          if-no-files-found: error
          retention-days: 90
