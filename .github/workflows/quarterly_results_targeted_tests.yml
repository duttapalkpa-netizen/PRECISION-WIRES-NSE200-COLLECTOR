name: Quarterly Results Targeted Tests

on:
  push:
    branches:
      - audit/prospective-selector-tracking
    paths:
      - ".github/workflows/quarterly_results_targeted_tests.yml"
      - "pipeline/quarterly_results_research.py"
      - "pipeline/quarterly_pdf_xbrl_metrics.py"
      - "qa/test_quarterly_results_research.py"
      - "qa/test_quarterly_pdf_xbrl_metrics.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-quarterly-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/prospective-selector-tracking
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install minimal dependencies
        run: python -m pip install "pandas>=2.2,<3" "requests>=2.31,<3" "pypdf>=4,<6"
      - name: Run only quarterly disclosure and Run 121 regression tests
        run: |
          python -m unittest -v \
            qa.test_quarterly_pdf_xbrl_metrics \
            qa.test_quarterly_results_research.QuarterlyResultsResearchTests.test_result_period_can_be_parsed_from_explicit_nse_filing_metadata \
            qa.test_quarterly_results_research.QuarterlyResultsResearchTests.test_board_meeting_is_not_a_declared_result \
            qa.test_quarterly_results_research.QuarterlyResultsResearchTests.test_clarification_and_delayed_submission_are_not_result_events \
            qa.test_quarterly_results_research.QuarterlyResultsResearchTests.test_reporting_period_alias_and_nse_attachment_source_are_preserved \
            qa.test_quarterly_results_research.QuarterlyResultsResearchTests.test_run121_four_invalid_disclosures_preserve_provenance_and_unknown \
            qa.test_quarterly_results_research.QuarterlyResultsResearchTests.test_period_aliases_are_explicit_and_conflicts_remain_unknown
      - name: Refresh official NSE security master for missing ISIN resolution
        run: python collector/security_master.py
      - name: Run bounded live quarterly endpoint/schema audit only
        run: |
          python pipeline/quarterly_results_research.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/quarterly_results/quarterly_results_research_report.json")
          if not p.exists():
              raise SystemExit("BLOCKED: quarterly results report was not created")
          report = json.loads(p.read_text(encoding="utf-8"))
          print("ENDPOINT_SCHEMA_STEP_1=" + json.dumps(report.get("endpoint_schema_step_1", {}), sort_keys=True))
          print("RECORD_SOURCE_VALIDATION=" + json.dumps(report.get("source_validation", {}), sort_keys=True))
          print("FINANCIAL_METRICS=" + json.dumps(report.get("financial_metrics", {}), sort_keys=True))
          print("RESEARCH_STATUS=" + str(report.get("status", "UNKNOWN")))
          PY
      - name: Run bounded source-linked XBRL metric extraction
        env:
          QUARTERLY_METRIC_MAX_DISCLOSURES: "50"
        run: |
          python pipeline/quarterly_pdf_xbrl_metrics.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/quarterly_results/filing_metric_extraction_report.json")
          if not p.exists():
              raise SystemExit("BLOCKED: metric extraction report missing")
          r = json.loads(p.read_text(encoding="utf-8"))
          print("METRIC_EXTRACTION=" + json.dumps({k:r.get(k) for k in ("status","input_result_disclosures","attachment_attempts","ledger_rows","verified_metric_rows","blocked_rows")}, sort_keys=True))
          if int(r.get("attachment_attempts", 0)) > 100:
              raise SystemExit("TIME_BUDGET_GUARD: attachment attempts exceeded bounded cap")
          PY
      - name: Rebuild normalized financial features from verified metric ledger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from pipeline.quarterly_results_research import build_financial_features, FINANCIALS_INPUT, OUT
          ledger = pd.read_csv(FINANCIALS_INPUT, dtype=str).fillna("") if FINANCIALS_INPUT.exists() else pd.DataFrame()
          if ledger.empty or "EXTRACTION_STATUS" not in ledger:
              raise SystemExit("BLOCKED: source-linked metric ledger missing")
          verified = ledger[ledger["EXTRACTION_STATUS"].eq("SOURCE_LINKED_XBRL_FACTS")].copy()
          required = ["SYMBOL","PERIOD_END","BASIS","SOURCE_URL","DISCLOSED_AT","REVENUE","PAT","EPS"]
          missing = [c for c in required if c not in verified.columns]
          if missing:
              raise SystemExit("BLOCKED: metric ledger missing normalized columns: " + ",".join(missing))
          # Preserve evidence rows in the immutable ledger; feature builder consumes only verified facts.
          verified[required].to_csv("data/raw/quarterly_financial_metrics_verified.csv", index=False)
          original = FINANCIALS_INPUT
          tmp = Path("data/raw/quarterly_financial_metrics_verified.csv")
          features, report = build_financial_features(tmp)
          OUT.mkdir(parents=True, exist_ok=True)
          features.to_csv(OUT / "quarterly_financial_features.csv", index=False)
          root = OUT / "quarterly_results_research_report.json"
          manifest = json.loads(root.read_text(encoding="utf-8")) if root.exists() else {}
          coverage = {"status": "PASS" if len(verified) > 0 else "BLOCKED_NO_VERIFIED_ROWS",
                      "verified_metric_rows": int(len(verified)),
                      "disclosure_rows_in_current_source": int(len(pd.read_csv("data/raw/quarterly_results_disclosures.csv"))) if Path("data/raw/quarterly_results_disclosures.csv").exists() else 0,
                      "coverage_scope": "bounded sample only; not full disclosure coverage",
                      "unverified_rows_remain_blocked": int(len(ledger) - len(verified))}
          manifest["financial_metrics"] = {**report, "coverage": coverage, "provenance_source": str(tmp)}
          manifest["step_2_status"] = "PARTIAL_VERIFIED_BLOCKED_INCOMPLETE_COVERAGE" if len(verified) else "BLOCKED"
          manifest["status"] = "COLLECTED_WITH_BLOCKERS"
          root.write_text(json.dumps(manifest, indent=2, allow_nan=False), encoding="utf-8")
          print("STEP2_FINANCIAL_FEATURES=" + json.dumps({"report":report,"coverage":coverage,"step_2_status":manifest["step_2_status"]}, sort_keys=True))
          PY
      - name: Diagnose unresolved filing timestamps and ISINs from raw NSE metadata
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          raw_path = Path("data/raw/quarterly_results_raw_responses/result_disclosure.json")
          val_path = Path("outputs/quarterly_results/source_validation_report.csv")
          master_path = Path("data/reference/security_master.csv")
          out = Path("outputs/quarterly_results/step2_root_cause_diagnostic.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          report = {"status": "BLOCKED", "diagnostic_only": True}
          if raw_path.exists():
              envelope = json.loads(raw_path.read_text(encoding="utf-8"))
              payload = envelope.get("payload", envelope) if isinstance(envelope, dict) else envelope
              def find_rows(obj):
                  if isinstance(obj, list) and (not obj or isinstance(obj[0], dict)):
                      return obj
                  if isinstance(obj, dict):
                      for key in ("data", "rows", "results", "financialResults"):
                          if isinstance(obj.get(key), list) and (not obj[key] or isinstance(obj[key][0], dict)):
                              return obj[key]
                      for value in obj.values():
                          found = find_rows(value) if isinstance(value, (dict, list)) else []
                          if found:
                              return found
                  return []
              rows = find_rows(payload)
              report["raw_response"] = {"rows": len(rows), "field_names": sorted({k for r in rows if isinstance(r, dict) for k in r})}
              report["timestamp_field_coverage"] = {}
              for field in ("broadcast_Date", "broadcastDateTime", "broadcastDate", "disseminationDate", "creation_Date", "revised_Date", "seq_Id"):
                  present = sum(bool(str(r.get(field) or "").strip()) for r in rows if isinstance(r, dict))
                  report["timestamp_field_coverage"][field] = {"present": present, "missing": len(rows)-present}
              report["raw_missing_broadcast_samples"] = [
                  {k:r.get(k) for k in ("symbol","seq_Id","type_Sub","qe_Date","broadcast_Date","creation_Date","revised_Date","revision_Remark","xbrl","ixbrl")}
                  for r in rows if isinstance(r, dict) and not str(r.get("broadcast_Date") or "").strip()
              ][:100]
          if val_path.exists():
              df = pd.read_csv(val_path, dtype=str).fillna("")
              invalid = df[df.get("RECORD_VALID", pd.Series(dtype=str)).str.lower().isin(["false","0"])]
              report["validation"] = {"rows": len(df), "valid": int((df.get("RECORD_VALID", pd.Series(dtype=str)).str.lower().isin(["true","1"])).sum()), "invalid": len(invalid)}
              report["invalid_by_missing_fields"] = invalid["MISSING_FIELDS"].value_counts().to_dict() if "MISSING_FIELDS" in invalid else {}
              report["invalid_samples"] = invalid[[c for c in ("SYMBOL","ISIN","PUBLICATION_TIMESTAMP","REPORTING_PERIOD","MISSING_FIELDS","SOURCE_URL") if c in invalid]].head(100).to_dict("records")
              missing_isin = sorted(set(invalid.loc[invalid.get("ISIN", pd.Series(dtype=str)).eq(""), "SYMBOL"].tolist())) if "ISIN" in invalid else []
              report["invalid_missing_isin_symbols"] = missing_isin
              if master_path.exists():
                  m = pd.read_csv(master_path, dtype=str).fillna("")
                  m.columns = [str(x).strip().upper() for x in m.columns]
                  sym = "SYMBOL" if "SYMBOL" in m else None
                  isin = "ISIN" if "ISIN" in m else ("ISIN NUMBER" if "ISIN NUMBER" in m else None)
                  if sym and isin:
                      mp = dict(zip(m[sym].str.strip().str.upper(), m[isin].str.strip().str.upper()))
                      report["security_master_resolution"] = {s: {"found": bool(mp.get(s)), "isin": mp.get(s,"")} for s in missing_isin}
          # Inspect official filing attachments for explicit ISIN identifiers.
          # Evidence is recorded per row; never infer ISIN from a symbol/name.
          import re, requests
          evidence = []
          if val_path.exists():
              df = pd.read_csv(val_path, dtype=str).fillna("")
              invalid = df[df.get("RECORD_VALID", pd.Series(dtype=str)).str.lower().isin(["false","0"])]
              for _, row in invalid.iterrows():
                  symbol = str(row.get("SYMBOL", "")).strip().upper()
                  if str(row.get("ISIN", "")).strip():
                      continue
                  url = str(row.get("SOURCE_URL", "")).strip()
                  item = {"symbol": symbol, "source_url": url, "status": "BLOCKED_NO_OFFICIAL_ISIN_EVIDENCE", "isin_candidates": []}
                  if url.startswith(("https://nsearchives.nseindia.com/", "https://www.nseindia.com/")):
                      try:
                          resp = requests.get(url, headers={"User-Agent":"Mozilla/5.0","Accept":"*/*"}, timeout=(4,8))
                          item["http_status"] = resp.status_code
                          if resp.status_code == 200:
                              body = resp.text[:5000000]
                              candidates = sorted(set(re.findall(r"\\bINE[A-Z0-9]{9}\\b", body.upper())))
                              item["isin_candidates"] = candidates
                              if len(candidates) == 1:
                                  item["status"] = "CANDIDATE_REQUIRES_ISSUER_CONTEXT_CHECK"
                              elif len(candidates) > 1:
                                  item["status"] = "AMBIGUOUS_MULTIPLE_ISIN_CANDIDATES"
                              else:
                                  item["status"] = "NO_ISIN_IN_OFFICIAL_ATTACHMENT"
                          else:
                              item["status"] = "OFFICIAL_ATTACHMENT_FETCH_FAILED"
                      except Exception as exc:
                          item["error"] = type(exc).__name__
                          item["status"] = "OFFICIAL_ATTACHMENT_FETCH_FAILED"
                  evidence.append(item)
          report["official_filing_isin_evidence"] = evidence
          evidence_path = out.parent / "official_filing_isin_evidence.json"
          evidence_path.write_text(json.dumps(evidence, indent=2, ensure_ascii=False), encoding="utf-8")
          out.write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding="utf-8")
          print("STEP2_ROOT_CAUSE_DIAGNOSTIC=" + json.dumps(report, sort_keys=True))
          PY
      - name: Upload bounded endpoint/schema report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-endpoint-schema-audit
          path: |
            outputs/quarterly_results/quarterly_results_research_report.json
            outputs/quarterly_results/source_validation_report.csv
            outputs/quarterly_results/quarterly_financial_features.csv
            data/raw/quarterly_results_disclosures.csv
            data/raw/quarterly_results_calendar.csv
            data/raw/quarterly_results_raw_responses/*.json
            outputs/quarterly_results/step2_root_cause_diagnostic.json
            outputs/quarterly_results/filing_metric_extraction_report.json
            data/raw/quarterly_financial_metrics_verified.csv
            data/raw/quarterly_financial_metrics.csv
            data/raw/quarterly_filing_evidence/*
          if-no-files-found: warn