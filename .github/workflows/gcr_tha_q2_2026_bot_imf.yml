name: GCR Thailand Q2-2026 BOT vs IMF Portfolio Dual-Leg Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gcr_tha_q2_2026_bot_imf.yml"
      - "scripts/research/reconcile_tha_q2_2026_bot_imf.py"
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse archived IMF panel and capture official BOT USD BOP table
        run: python scripts/research/reconcile_tha_q2_2026_bot_imf.py
      - name: Upload raw BOT page, exact-row reconciliation and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcr-tha-q2-2026-bot-imf-${{ github.run_id }}
          path: artifacts/gcr_tha_q2_2026_bot_imf/
          if-no-files-found: error
          retention-days: 90
