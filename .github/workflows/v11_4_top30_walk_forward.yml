name: V11.4 Top-30 Walk-Forward Validation — Leakage Safe

on:
  workflow_dispatch:
  push:
    branches: [fix/iip-41-vintage-audit-clean]
    paths:
      - "pipeline/walk_forward_backtest.py"
      - "pipeline/reconcile_walk_forward_maturity.py"
      - "pipeline/finalize_walk_forward_artifact.py"
      - ".github/workflows/v11_4_top30_walk_forward.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: v11-4-top30-walk-forward-audit
  cancel-in-progress: false

jobs:
  top30-walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Download verified 318-session rolling source
        uses: actions/download-artifact@v4
        with:
          name: portfolio-two-stock-rolling-incremental-1
          path: rolling_source
          repository: ${{ github.repository }}
          run-id: "41987260655"
          github-token: ${{ github.token }}
      - name: Verify source manifest and dataset SHA-256
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import pandas as pd
          root=Path("rolling_source")
          csvs=list(root.rglob("nse_eq_rolling_sessions.csv"))
          mans=list(root.rglob("nse_eq_rolling_manifest.json"))
          if len(csvs)!=1 or len(mans)!=1: raise SystemExit("BLOCKED: source CSV/manifest cardinality")
          p,m=csvs[0],mans[0]
          meta=json.loads(m.read_text())
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          if meta.get("status")!="PASS_ROLLING_APPEND" or meta.get("dataset_sha256")!=sha:
              raise SystemExit("BLOCKED: rolling source manifest/SHA mismatch")
          d=pd.read_csv(p,usecols=["SYMBOL","SERIES","DATE"])
          if d.DATE.nunique()!=318 or d.duplicated(["SYMBOL","SERIES","DATE"]).any():
              raise SystemExit("BLOCKED: rolling source calendar/key validation")
          print(json.dumps({"status":"PASS_INPUT","path":str(p),"sha256":sha,
                            "sessions":int(d.DATE.nunique()),"rows":len(d),
                            "last_session":str(d.DATE.max())},indent=2))
          Path("rolling_source_path.txt").write_text(str(p))
          PY
      - name: Run leakage-safe 30-cutoff Top-30 walk-forward audit
        env:
          WF_SOURCE: ${{ github.workspace }}/${{ steps.source.outputs.path }}
          WF_SESSIONS: "30"
        run: |
          SOURCE=$(cat rolling_source_path.txt)
          WF_SOURCE="$GITHUB_WORKSPACE/$SOURCE" WF_SESSIONS=30 python pipeline/walk_forward_backtest.py
      - name: Reconcile all metrics on complete matured windows
        run: python pipeline/reconcile_walk_forward_maturity.py --input outputs/backtest
      - name: Recompute final metrics from persisted CSVs and seal file hashes
        run: python pipeline/finalize_walk_forward_artifact.py
      - name: Upload Top-30 walk-forward evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-4-top30-walk-forward-30-cutoffs-${{ github.run_number }}
          path: |
            outputs/backtest/
            rolling_source_path.txt
          if-no-files-found: warn
