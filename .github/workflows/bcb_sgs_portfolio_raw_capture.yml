name: BCB SGS Portfolio Raw Capture (Research Only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bcb_sgs_portfolio_raw_capture.yml"
      - "scripts/research/capture_bcb_sgs_portfolio_raw.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Capture official SGS raw series and validate
        run: python scripts/research/capture_bcb_sgs_portfolio_raw.py
      - name: Upload immutable evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcb-sgs-portfolio-raw-${{ github.run_id }}
          path: artifacts/bcb_sgs_portfolio/
          if-no-files-found: error
          retention-days: 90
