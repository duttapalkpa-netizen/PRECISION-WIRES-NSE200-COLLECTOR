name: NSE Equity Security Master — Identity & Provenance Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-master:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check pandas requests
      - name: Compile collector
        run: python -m py_compile collector/security_master.py
      - name: Acquire official NSE equity master
        run: python collector/security_master.py
      - name: Verify raw-source hash and output identity coverage
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          raw=Path("data/reference/NSE_EQUITY_L_source.csv")
          master=Path("data/reference/security_master.csv")
          universe=Path("config/universe.csv")
          manifest=json.loads(Path("data/reference/security_master_manifest.json").read_text())
          digest=hashlib.sha256(raw.read_bytes()).hexdigest()
          assert digest == manifest["raw_response_sha256"], "raw source SHA-256 mismatch"
          with master.open(newline="",encoding="utf-8") as f: rows=list(csv.DictReader(f))
          with universe.open(newline="",encoding="utf-8") as f: symbols=list(csv.DictReader(f))
          assert rows and symbols, "empty NSE EQ universe"
          assert len(rows)==manifest["rows_series_eq"]==len(symbols), "row-count mismatch"
          assert len({r["SYMBOL"] for r in rows})==len(rows), "duplicate symbols"
          assert len({r["ISIN"] for r in rows})==len(rows), "duplicate ISINs"
          assert all(r["SYMBOL"] and r["ISIN"] and r["COMPANY_NAME"] for r in rows), "blank identity fields"
          assert [r["SYMBOL"] for r in rows]==[r["SYMBOL"] for r in symbols], "universe/master mismatch"
          print("NSE_SECURITY_MASTER_AUDIT_PASS", len(rows), digest)
          PY
      - name: Upload immutable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-equity-security-master-${{ github.run_number }}
          path: |
            data/reference/NSE_EQUITY_L_source.csv
            data/reference/security_master.csv
            data/reference/security_master_manifest.json
            config/universe.csv
          if-no-files-found: error
