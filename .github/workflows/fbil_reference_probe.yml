name: FBIL reference-rate live probe

on:
  push:
    branches:
      - research/global-capital-rotation-overlay-v1
    paths:
      - ".github/workflows/fbil_reference_probe.yml"
      - "qa/validate_fbil_reference_payload.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fbil-reference-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Probe known historical and recent windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-output
          python - <<'PY'
          import hashlib, json, urllib.request, urllib.error
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          out = Path("probe-output")
          ist = ZoneInfo("Asia/Kolkata")
          now = datetime.now(timezone.utc)
          today = now.astimezone(ist).date()
          windows = {
              "known_overlap": (date(2026, 10, 15), date(2026, 10, 16)),
              "recent_window": (today - timedelta(days=2), today),
          }
          for label, (start, end) in windows.items():
              def api_date(d):
                  return f"{d.year}-{d.month}-{d.day}"
              url = (
                  "https://www.fbil.org.in/wasdm/refrates/fetchfiltered"
                  f"?fromDate={api_date(start)}&toDate={api_date(end)}&authenticated=false"
              )
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "PRECISION-WIRES-V11.3-research/1.0",
                      "Accept": "application/json",
                  },
              )
              status_code = None
              headers = {}
              try:
                  with urllib.request.urlopen(req, timeout=35) as response:
                      raw = response.read()
                      status_code = response.status
                      headers = dict(response.headers.items())
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  status_code = exc.code
                  headers = dict(exc.headers.items()) if exc.headers else {}
              except Exception as exc:
                  raw = b""
                  (out / f"{label}_transport_error.txt").write_text(repr(exc) + "\n")
              (out / f"{label}_raw.json").write_bytes(raw)
              metadata = {
                  "request_url": url,
                  "from_date": start.isoformat(),
                  "to_date": end.isoformat(),
                  "retrieved_at_utc": now.isoformat(),
                  "retrieved_at_ist": now.astimezone(ist).isoformat(),
                  "http_status": status_code,
                  "content_type": headers.get("Content-Type"),
                  "raw_bytes": len(raw),
                  "raw_sha256": hashlib.sha256(raw).hexdigest(),
              }
              try:
                  obj = json.loads(raw)
                  metadata["json_root_type"] = type(obj).__name__
                  metadata["record_count"] = len(obj) if isinstance(obj, list) else None
                  metadata["json_status"] = (
                      "PASS_NONEMPTY_ARRAY" if isinstance(obj, list) and obj
                      else "EMPTY_ARRAY" if isinstance(obj, list)
                      else "INVALID_ROOT"
                  )
              except Exception as exc:
                  metadata["json_status"] = "INVALID_JSON"
                  metadata["json_error"] = str(exc)
              (out / f"{label}_metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
              print(label, json.dumps(metadata))
          PY

      - name: Validate non-empty payloads only
        shell: bash
        run: |
          set -euo pipefail
          for label in known_overlap recent_window; do
            [ -f "probe-output/${label}_metadata.json" ] || continue
            if grep -q '"json_status": "PASS_NONEMPTY_ARRAY"' "probe-output/${label}_metadata.json"; then
              python qa/validate_fbil_reference_payload.py \
                --raw "probe-output/${label}_raw.json" \
                --from-date "$(python -c "import json; print(json.load(open('probe-output/${label}_metadata.json'))['from_date'])")" \
                --to-date "$(python -c "import json; print(json.load(open('probe-output/${label}_metadata.json'))['to_date'])")" \
                --csv-out "probe-output/${label}_validated.csv"
            else
              echo "NO INGESTION: ${label} returned no non-empty valid array."
            fi
          done

      - name: Upload raw responses and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fbil-reference-probes-${{ github.run_id }}
          path: probe-output/
          if-no-files-found: warn
          retention-days: 30
