name: IMF Brazil Public API History Probe
on:
  push:
    paths:
      - 'scripts/research/imf_brazil_public_api_probe_trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan bounded Brazil registration transaction ID batch (613-812)
        run: python scripts/research/probe_imf_brazil_registration_batch.py --start-id 613 --end-id 812 --workers 12
      - name: Capture exact Brazil registration lifecycle for tx 667
        run: python scripts/research/probe_imf_brazil_exact_registration.py
      - name: Upload raw responses and manifest
        uses: actions/upload-artifact@v4
        with:
          name: imf-brazil-public-api-probe-${{ github.run_id }}
          path: |
            imf_brazil_registration_batch/
            imf_brazil_exact_registration/
          if-no-files-found: error
          retention-days: 90
