name: IMF Brazil Public API History Probe
on:
  push:
    paths:
      - 'scripts/research/imf_brazil_public_api_probe_trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe public IMF history and structure endpoints
        run: python scripts/research/probe_imf_brazil_public_api.py
      - name: Upload raw responses and manifest
        uses: actions/upload-artifact@v4
        with:
          name: imf-brazil-public-api-probe-${{ github.run_id }}
          path: imf_brazil_public_api_probe/
          if-no-files-found: error
          retention-days: 90
