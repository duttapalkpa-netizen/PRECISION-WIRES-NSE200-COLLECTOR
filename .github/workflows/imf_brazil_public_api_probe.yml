name: IMF Brazil Public API History Probe
on:
  push:
    paths:
      - 'scripts/research/imf_brazil_public_api_probe_trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture exact Brazil registration lifecycle for tx 667
        if: ${{ !contains(github.event.head_commit.message, '[PA-TX2-ONLY]') }}
        run: python scripts/research/probe_imf_brazil_exact_registration.py
      - name: Capture complete Brazil Registration URN lifecycle (all history events)
        if: ${{ !contains(github.event.head_commit.message, '[PA-TX2-ONLY]') }}
        run: python scripts/research/capture_imf_brazil_registration_lifecycle.py
      - name: Cross-check Brazil registration history against global transaction index
        if: ${{ !contains(github.event.head_commit.message, '[PA-TX2-ONLY]') }}
        run: python scripts/research/validate_imf_brazil_history_against_global_index.py
      - name: Probe Brazil PA transaction 2 and current BOP6/BOP_BPM6 structures
        run: python scripts/research/probe_imf_brazil_pa_structure_revision.py
      - name: Capture official IMF SDMX Central RSS transaction archive
        run: python scripts/research/probe_imf_brazil_rss_transaction_archive.py
      - name: Upload raw responses and manifest
        uses: actions/upload-artifact@v4
        with:
          name: imf-brazil-public-api-probe-${{ github.run_id }}
          path: |
            imf_brazil_pa_structure_revision/
            imf_brazil_rss_transaction_archive/
            imf_brazil_exact_registration/
            imf_brazil_registration_lifecycle/
            imf_brazil_history_index_reconciliation/
          if-no-files-found: error
          retention-days: 90
