name: IMF BOP SCALE Semantics Resolver
on:
  push:
    paths:
      - "scripts/research/imf_bop_scale_semantics_trigger.txt"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve official BOP SCALE semantics
        run: python scripts/research/resolve_imf_bop_scale_semantics.py
      - name: Upload raw DSD, concept and codelist
        uses: actions/upload-artifact@v4
        with:
          name: imf-bop-scale-semantics-${{ github.run_id }}
          path: imf_bop_scale_semantics/
          if-no-files-found: error
          retention-days: 90
