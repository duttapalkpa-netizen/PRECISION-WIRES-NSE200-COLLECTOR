name: H.10 and FRED raw evidence capture
on:
  push:
    branches:
      - research/taxonomy-crosswalk-contract-20261117
    paths:
      - "scripts/capture_h10_fred_raw_sources.py"
      - ".github/workflows/h10_fred_raw_capture.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture official raw sources and compute SHA-256
        id: capture
        continue-on-error: true
        run: python scripts/capture_h10_fred_raw_sources.py
      - name: Upload immutable-run evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h10-fred-raw-capture-${{ github.run_id }}
          path: artifacts/h10_fred_capture/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce capture acceptance
        if: always()
        run: |
          if [ "${{ steps.capture.outcome }}" != "success" ]; then
            echo "Capture incomplete; inspect artifact capture_manifest.json"
            exit 1
          fi
          echo "All three raw sources captured and checks passed."
