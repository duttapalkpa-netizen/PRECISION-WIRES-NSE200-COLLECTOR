name: FBIL Daily 10Y G-Sec Provenance Audit
on:
  push:
    branches: [fix/factor-registry-same-snapshot-reconcile]
    paths:
      - "pipeline/audit_fbil_10y_provenance.py"
      - "pipeline/probe_fbil_gsec_api.py"
      - "pipeline/parse_fbil_gsec_archives.py"
      - "pipeline/backfill_fbil_gsec_history.py"
      - "pipeline/discover_fbil_js_endpoints.py"
      - "qa/test_fbil_10y_provenance.py"
      - "qa/test_fbil_archive_parser.py"
      - "qa/test_fbil_backfill.py"
      - ".github/workflows/fbil_10y_provenance_audit.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fbil-10y-provenance-audit
  cancel-in-progress: false
jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 openpyxl
      - name: Unit tests
        run: |
          python -m unittest qa.test_fbil_10y_provenance -v
          python -m unittest qa.test_fbil_archive_parser -v
          python -m unittest qa.test_fbil_backfill -v
      - name: Discover official FBIL JavaScript bundles and API/archive endpoints
        run: python pipeline/discover_fbil_js_endpoints.py
      - name: Probe official FBIL GSEC JSON endpoint (read-only)
        run: python pipeline/probe_fbil_gsec_api.py
      - name: Backfill official FBIL G-Sec archive for 12 months (target >=200 trading sessions)
        continue-on-error: true
        run: python pipeline/backfill_fbil_gsec_history.py
      - name: Parse official FBIL published XLSX archives (date-only; no inferred release time)
        continue-on-error: true
        run: python pipeline/parse_fbil_gsec_archives.py
      - name: Retain legacy homepage parser diagnostics
        continue-on-error: true
        run: python pipeline/audit_fbil_10y_provenance.py
      - name: Verify archive row integrity and timestamp hold
        if: always() && hashFiles('artifacts/fbil_10y_provenance/fbil_historical_backfill_report.json') != ''
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/fbil_10y_provenance")
          r=json.loads((p/"fbil_historical_backfill_report.json").read_text())
          assert r["minimum_200_sessions_met"] is True
          assert r["downloaded_xlsx_files"] >= 200
          assert r["commercial_permission"] == "NOT_OBTAINED; written permission required before production use"
          print({"backfill_status":r["status"],"sessions":r["downloaded_xlsx_files"],"date_range":[r["downloaded_date_min"],r["downloaded_date_max"]],"timestamp_policy":r["timestamp_policy"],"permission":r["commercial_permission"]})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fbil-daily-10y-provenance-audit
          path: artifacts/fbil_10y_provenance/
          if-no-files-found: error
