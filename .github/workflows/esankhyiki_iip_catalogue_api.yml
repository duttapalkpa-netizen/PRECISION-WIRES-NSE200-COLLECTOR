name: e-Sankhyiki IIP Catalogue API Metadata
on:
  push:
    branches: [fix/factor-registry-same-snapshot-reconcile]
    paths:
      - "pipeline/probe_esankhyiki_iip_catalogue_api.py"
      - ".github/workflows/esankhyiki_iip_catalogue_api.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: esankhyiki-iip-catalogue-api
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python pipeline/probe_esankhyiki_iip_catalogue_api.py
      - uses: actions/upload-artifact@v4
        with:
          name: esankhyiki-iip-catalogue-api-metadata
          path: artifacts/esankhyiki_iip_catalogue_api/
          if-no-files-found: error
