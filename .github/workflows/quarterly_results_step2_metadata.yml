name: Quarterly Results Step 2 Metadata Audit

on:
  push:
    branches:
      - fix/factor-registry-same-snapshot-reconcile
    paths:
      - ".github/workflows/quarterly_results_step2_metadata.yml"
      - "pipeline/quarterly_results_research.py"
      - "pipeline/quarterly_results_step2_metadata_audit.py"
      - "qa/test_quarterly_results_research.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  step2-metadata-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/factor-registry-same-snapshot-reconcile
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal dependencies
        run: python -m pip install "pandas>=2.2,<3" "requests>=2.31,<3"
      - name: Run quarterly disclosure regression tests
        run: |
          python -m unittest -v \
            qa.test_quarterly_results_research.QuarterlyResultsResearchTests.test_integrated_filing_fetches_next_page_using_one_based_request \
            qa.test_quarterly_results_research.QuarterlyResultsResearchTests.test_revision_without_broadcast_keeps_original_timestamp_unknown \
            qa.test_quarterly_results_research.QuarterlyResultsResearchTests.test_step1_blocks_incomplete_integrated_filing_pagination
      - name: Refresh official NSE security master
        run: python collector/security_master.py
      - name: Fetch complete NSE disclosure feed and normalize metadata
        run: python pipeline/quarterly_results_research.py
      - name: Independently audit all five metadata fields for every disclosure
        id: metadata_audit
        continue-on-error: true
        run: python pipeline/quarterly_results_step2_metadata_audit.py
      - name: Upload Step 2 metadata evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarterly-step2-metadata-audit
          if-no-files-found: error
          path: |
            outputs/quarterly_results/step2_metadata_coverage.json
            outputs/quarterly_results/step2_all_record_field_audit.csv
            outputs/quarterly_results/step2_missing_records.csv
            outputs/quarterly_results/step2_ambiguous_records.csv
            outputs/quarterly_results/source_validation_report.csv
            data/raw/quarterly_results_raw_responses/result_disclosure.json
      - name: Enforce Step 2 acceptance after evidence upload
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/quarterly_results/step2_metadata_coverage.json")
          if not p.exists():
              raise SystemExit("BLOCKED: Step 2 metadata report missing")
          report = json.loads(p.read_text(encoding="utf-8"))
          if report.get("status") != "PASS":
              raise SystemExit("BLOCKED: Step 2 metadata acceptance tests did not all pass")
          print("STEP2_STATUS=PASS")
          PY
