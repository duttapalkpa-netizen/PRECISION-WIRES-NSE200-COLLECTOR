name: RBI DBIE Government Bond Yield Source Adapter QA
on:
  push:
    branches: [fix/factor-registry-same-snapshot-reconcile]
    paths:
      - "pipeline/collect_rbi_dbie_bond_yields.py"
      - "qa/test_rbi_dbie_bond_yield_adapter.py"
      - ".github/workflows/rbi_dbie_bond_yield_adapter.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rbi-dbie-bond-yield-adapter
  cancel-in-progress: false
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Run fail-closed schema diagnostic tests
        run: python -m unittest qa.test_rbi_dbie_bond_yield_adapter -v
      - name: Capture official RBI DBIE raw schema evidence
        run: python pipeline/collect_rbi_dbie_bond_yields.py
      - name: Verify raw evidence hashes and no-promotion boundary
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          p=Path("artifacts/india_bond_yields")
          r=json.loads((p/"rbi_dbie_source_adapter_report.json").read_text())
          raw=p/"rbi_dbie_raw.csv"
          meta=p/"rbi_dbie_table_metadata.json"
          assert r["status"]=="RBI_DBIE_RAW_SCHEMA_DIAGNOSTIC_PASS_MAPPING_BLOCKED"
          assert r["mapping_status"]=="BLOCKED"
          assert r["factor_registry_promotion"]=="NOT_PROMOTED"
          assert r["frequency"]=="MONTHLY"
          assert r["csv_data_rows"]>0 and len(r["sample_rows"])>0
          assert hashlib.sha256(raw.read_bytes()).hexdigest()==r["raw_csv_sha256"]
          assert hashlib.sha256(meta.read_bytes()).hexdigest()==r["metadata_sha256"]
          assert any(x.startswith("c") and x[1:].isdigit() for x in r["csv_header"])
          print({"status":r["status"],"rows":r["csv_data_rows"],"header":r["csv_header"],"raw_sha256":r["raw_csv_sha256"],"mapping":"BLOCKED","promotion":"NOT_PROMOTED"})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbi-dbie-raw-schema-diagnostic
          path: artifacts/india_bond_yields/
          if-no-files-found: error
