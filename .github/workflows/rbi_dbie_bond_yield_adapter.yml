name: RBI DBIE Government Bond Yield Source Adapter QA
on:
  push:
    branches: [fix/factor-registry-same-snapshot-reconcile]
    paths:
      - "pipeline/collect_rbi_dbie_bond_yields.py"
      - "qa/test_rbi_dbie_bond_yield_adapter.py"
      - ".github/workflows/rbi_dbie_bond_yield_adapter.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rbi-dbie-bond-yield-adapter
  cancel-in-progress: false
jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Run adapter unit tests
        run: python -m unittest qa.test_rbi_dbie_bond_yield_adapter -v
      - name: Collect and normalize official RBI DBIE New Format tab
        run: python pipeline/collect_rbi_dbie_bond_yields.py
      - name: Verify row-level QA and SHA-256 manifest
        run: |
          python - <<'PY'
          import csv,json,hashlib
          from pathlib import Path
          p=Path("artifacts/india_bond_yields")
          r=json.loads((p/"rbi_dbie_source_adapter_report.json").read_text())
          f=p/"india_bond_yields.csv"
          with f.open(newline="",encoding="utf-8") as h: rows=list(csv.DictReader(h))
          assert r["status"]=="RBI_DBIE_MONTHLY_ADAPTER_PASS_EVIDENCE_ONLY"
          assert r["normalized_rows"]==9477==len(rows)
          assert r["distinct_months"]==365
          assert r["duplicate_date_tenor_keys"]==0 and r["invalid_numeric_rows"]==0
          assert r["release_timestamp_status"]=="UNKNOWN_NOT_SUPPLIED_PER_OBSERVATION"
          assert r["factor_registry_promotion"].startswith("NOT_PROMOTED")
          assert hashlib.sha256(f.read_bytes()).hexdigest()==r["normalized_csv_sha256"]
          assert len({(x["DATE"],x["TERM_YEARS"]) for x in rows})==len(rows)
          assert all(x["FREQUENCY"]=="MONTHLY" for x in rows)
          print({"status":r["status"],"rows":len(rows),"months":r["distinct_months"],"sha256":r["normalized_csv_sha256"],"promotion":r["factor_registry_promotion"]})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbi-dbie-monthly-gsec-yield-adapter
          path: artifacts/india_bond_yields/
          if-no-files-found: error
