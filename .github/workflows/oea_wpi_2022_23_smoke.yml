name: OEA WPI 2022-23 September Official Live Smoke
on:
  push:
    branches: [fix/factor-registry-same-snapshot-reconcile]
    paths:
      - "pipeline/collect_oea_wpi_2022_23_smoke.py"
      - "qa/test_oea_wpi_2022_23_smoke.py"
      - ".github/workflows/oea_wpi_2022_23_smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oea-wpi-2022-23-live-smoke
  cancel-in-progress: true
jobs:
  wpi-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run focused WPI domain tests
        run: python -m unittest qa.test_oea_wpi_2022_23_smoke -v
      - name: Collect official OEA/PIB WPI release
        run: python pipeline/collect_oea_wpi_2022_23_smoke.py
      - name: Verify evidence and raw hash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("artifacts/oea_wpi_2022_23_smoke")
          q=json.loads((p/"domain_qa.json").read_text()); m=json.loads((p/"manifest.json").read_text())
          assert q["status"]=="PASS" and q["base_year"]=="2022-23"
          assert q["reference_period"]=="September 2026" and q["provisional"] is True
          assert all(q["domain_checks"].values())
          assert hashlib.sha256((p/m["raw_file"]).read_bytes()).hexdigest()==m["sha256"]
          print({"qa":"PASS","sha256":m["sha256"],"observations":q["observations"]})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oea-wpi-2022-23-september-live-smoke
          path: artifacts/oea_wpi_2022_23_smoke/
          if-no-files-found: warn
