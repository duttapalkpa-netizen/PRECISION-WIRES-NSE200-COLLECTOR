name: NSE Historical Backfill (Branch-Scoped Collector)

on:
  workflow_dispatch:
    inputs:
      before_date:
        description: "Exclusive cutoff: first date of existing 200-session cache"
        required: true
        default: "2025-11-04"
        type: string
      sessions:
        description: "Number of prior verified NSE trading sessions"
        required: true
        default: "60"
        type: string

# Default-branch registration only. Select research/nse-57-session-backfill
# in the dispatch form to run the verified collector. The main-branch job remains
# deliberately disabled and cannot collect data or modify artifacts.
jobs:
  registration_only:
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Intentionally do nothing
        run: echo "Registration stub only; select the research branch to run the collector."
