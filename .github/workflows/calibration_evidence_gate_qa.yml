name: V11.3 calibration evidence gate QA

on:
  pull_request:
    paths:
      - "pipeline/calibration_gate.py"
      - "qa/test_calibration_gate_policy.py"
      - "qa/test_v11_3_calibration_loader_audit.py"
      - ".github/workflows/calibration_evidence_gate_qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibration-gate-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated calibration gate tests
        run: python -m unittest qa/test_calibration_gate_policy.py qa/test_v11_3_calibration_loader_audit.py
