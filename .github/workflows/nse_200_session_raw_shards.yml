name: NSE 200-Session Raw Archive Shards

on:
  pull_request:
    paths:
      - "collector/nse_download.py"
      - "scripts/research/merge_raw_archive_shards.py"
      - "scripts/research/build_raw_archive_manifest.py"
      - ".github/workflows/nse_200_session_raw_shards.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nse-200-raw-shards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acquire-shard:
    name: "Acquire shard ${{ matrix.shard }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - shard: "00"
            start: "2026-01-21"
            end: "2026-02-08"
          - shard: "01"
            start: "2026-02-09"
            end: "2026-02-22"
          - shard: "02"
            start: "2026-02-23"
            end: "2026-03-08"
          - shard: "03"
            start: "2026-03-09"
            end: "2026-03-22"
          - shard: "04"
            start: "2026-03-23"
            end: "2026-04-05"
          - shard: "05"
            start: "2026-04-06"
            end: "2026-04-19"
          - shard: "06"
            start: "2026-04-20"
            end: "2026-05-03"
          - shard: "07"
            start: "2026-05-04"
            end: "2026-05-17"
          - shard: "08"
            start: "2026-05-18"
            end: "2026-05-31"
          - shard: "09"
            start: "2026-06-01"
            end: "2026-06-14"
          - shard: "10"
            start: "2026-06-15"
            end: "2026-06-28"
          - shard: "11"
            start: "2026-06-29"
            end: "2026-07-12"
          - shard: "12"
            start: "2026-07-13"
            end: "2026-07-26"
          - shard: "13"
            start: "2026-07-27"
            end: "2026-08-09"
          - shard: "14"
            start: "2026-08-10"
            end: "2026-08-23"
          - shard: "15"
            start: "2026-08-24"
            end: "2026-09-06"
          - shard: "16"
            start: "2026-09-07"
            end: "2026-09-20"
          - shard: "17"
            start: "2026-09-21"
            end: "2026-10-04"
          - shard: "18"
            start: "2026-10-05"
            end: "2026-10-18"
          - shard: "19"
            start: "2026-10-19"
            end: "2026-11-01"
          - shard: "20"
            start: "2026-11-02"
            end: "2026-11-13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Acquire official NSE raw files for bounded date range
        run: |
          python collector/nse_download.py \
            --start-date "${{ matrix.start }}" \
            --end-date "${{ matrix.end }}" \
            --out data/raw
      - name: Upload isolated raw shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-raw-shard-${{ matrix.shard }}
          path: data/raw/
          if-no-files-found: error
          retention-days: 30

  merge-and-audit:
    name: Merge exact 200-session archive and audit
    needs: acquire-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download all 21 isolated shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: nse-raw-shard-*
          path: artifacts/shards
          merge-multiple: false
      - name: Merge without rewriting raw bytes and require exactly 200 sessions
        run: python scripts/research/merge_raw_archive_shards.py --input-root artifacts/shards --output-root data/raw --expected-sessions 200
      - name: Upload final raw archive and SHA-256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: nse-200-session-raw-archive-${{ github.run_number }}
          path: |
            data/raw/
            data/qa/raw_archive_manifest.json
          if-no-files-found: error
          retention-days: 90
