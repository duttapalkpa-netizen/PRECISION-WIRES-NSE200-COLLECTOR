name: GCR Philippines Q2-2026 BSP vs IMF Portfolio Dual-Leg Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gcr_phl_q2_2026_bsp_imf.yml"
      - "scripts/research/reconcile_phl_q2_2026_bsp_imf.py"
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reuse archived IMF panel and capture official BSP Q2 BOP tables
        run: python scripts/research/reconcile_phl_q2_2026_bsp_imf.py
      - name: Upload raw BSP tables, exact-row reconciliation and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcr-phl-q2-2026-bsp-imf-${{ github.run_id }}
          path: artifacts/gcr_phl_q2_2026_bsp_imf/
          if-no-files-found: error
          retention-days: 90
