name: Fast Alternate-Source Verification (Artifact Only)

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Step 3 workflow run ID containing the discovery artifact"
        required: true
        type: string
  push:
    branches: [audit/prospective-selector-tracking]
    paths:
      - ".github/workflows/fast_alternate_source_verification.yml"
      - "pipeline/stock_news_alternate_source_verify.py"
      - "pipeline/stock_news_alternate_source_resolution_join.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: fast-alternate-source-verification-${{ github.event.inputs.source_run_id || '39829905162' }}
  cancel-in-progress: false

jobs:
  verify-alternate-leads:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout audit branch only
        uses: actions/checkout@v4
        with:
          ref: audit/prospective-selector-tracking
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only verifier dependencies
        run: python -m pip install pandas requests googlenewsdecoder
      - name: Resolve source run ID
        id: source
        env:
          INPUT_RUN_ID: ${{ github.event.inputs.source_run_id }}
        run: |
          set -euo pipefail
          run_id="${INPUT_RUN_ID:-39829905162}"
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid source run ID" >&2
            exit 2
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "SOURCE_STEP3_RUN_ID=$run_id"
      - name: Download prior Step 3 discovery artifact (no rebuild)
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          run_id: ${{ steps.source.outputs.run_id }}
          name: step3-news-catalyst-join-audit
          path: artifact
          if_no_artifact_found: fail
      - name: Verify alternate publisher leads only
        run: python pipeline/stock_news_alternate_source_verify.py
      - name: Audit-join verified publisher resolutions to discovery snapshot
        run: python pipeline/stock_news_alternate_source_resolution_join.py
      - name: Rebuild news readiness from the archived source ledger
        run: python pipeline/stock_news_24h_join.py
      - name: Reconcile RACE and RIIL provenance against the unchanged source ledger
        run: python pipeline/stock_news_ledger_reconciliation_audit.py
      - name: Upload compact verification and resolution audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alternate-source-verification-${{ steps.source.outputs.run_id }}
          if-no-files-found: warn
          path: |
            outputs/news_24h/alternate_source_verification_report.json
            outputs/news_24h/alternate_source_verification_results.csv
            outputs/news_24h/alternate_source_resolution_join.json
            outputs/news_24h/alternate_source_resolution_join.csv
            outputs/news_24h/stock_news_24h_cutoff_join.csv
            outputs/news_24h/stock_news_24h_readiness.json
            outputs/news_24h/stock_news_ledger_reconciliation.csv
            outputs/news_24h/stock_news_ledger_reconciliation.json
