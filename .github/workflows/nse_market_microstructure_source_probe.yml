name: NSE Market Microstructure Official Source Probe
# Probe latest published surveillance indicators (30-Oct-2026) and 02-Nov-2026 price-band snapshot.
on:
  push:
    branches:
      - fix/factor-registry-same-snapshot-reconcile
    paths:
      - '.github/workflows/nse_market_microstructure_source_probe.yml'
      - 'pipeline/nse_market_microstructure_source_probe.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nse-market-microstructure-source-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pandas>=2.2,<3' 'requests>=2.31,<3'
      - name: Probe exact official NSE reports for 02-Nov-2026
        run: python pipeline/nse_market_microstructure_source_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nse-market-microstructure-source-probe
          path: artifacts/nse_market_microstructure_probe/
          if-no-files-found: warn
          retention-days: 90
