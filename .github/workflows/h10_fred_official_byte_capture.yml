name: H10 FRED Official Byte Capture (Research Only)
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research/capture_h10_fred_official_bytes.py"
      - ".github/workflows/h10_fred_official_byte_capture.yml"
permissions:
  contents: read
  actions: read
concurrency:
  group: h10-fred-byte-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture official raw bytes and validate crosswalk
        run: python scripts/research/capture_h10_fred_official_bytes.py
      - name: Upload immutable capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h10-fred-official-byte-capture
          path: h10_fred_capture/
          if-no-files-found: warn
          retention-days: 90
