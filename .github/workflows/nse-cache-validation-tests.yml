name: NSE Cache Integrity Tests

on:
  push:
    branches:
      - fix/factor-registry-same-snapshot-reconcile
    paths:
      - 'collector/nse_download.py'
      - 'tests/test_nse_cache_validation.py'
      - 'collector/nse_warm_cache_benchmark.py'
      - 'tests/test_nse_warm_cache_benchmark.py'
      - '.github/workflows/nse-cache-validation-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cache-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install pandas requests
      - name: Run focused cache integrity tests
        run: python -m unittest -v tests.test_nse_cache_validation tests.test_nse_warm_cache_benchmark