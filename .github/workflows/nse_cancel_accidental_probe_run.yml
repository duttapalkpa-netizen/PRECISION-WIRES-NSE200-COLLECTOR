name: Cancel Accidental NSE Research-Trigger Runs
on:
  push:
    paths:
      - 'scripts/research/nse_cancel_accidental_probe_trigger.txt'
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel accidental production collector runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run_id in 44463995998 44463990789 44463987099 44464895192; do
            gh api --method POST repos/${{ github.repository }}/actions/runs/${run_id}/cancel || true
          done
