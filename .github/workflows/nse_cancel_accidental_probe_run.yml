name: Cancel Accidental NSE Research-Trigger Run
on:
  push:
    paths:
      - 'scripts/research/nse_cancel_accidental_probe_trigger.txt'
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel accidental production collector run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/actions/runs/44463995998/cancel
