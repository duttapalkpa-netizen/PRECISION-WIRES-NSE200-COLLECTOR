name: BCB Domestic Release Vintage QA

on:
  push:
    branches:
      - research/bcb-priority-metadata-audit-20261117
    paths:
      - 'scripts/research/extract_bcb_domestic_portfolio_release_vintage.py'
      - 'data/raw/bcb/BCB_HISTORICAL_RELEASE_TABLES_VINTAGE_MANIFEST_20261117.json'
      - 'data/raw/bcb/release_tables_202601/**'
      - 'data/raw/bcb/release_tables_202603/**'
      - 'data/raw/bcb/release_tables_202610/**'
      - 'data/raw/bcb/instrument_net_capture_20261117/**'
      - 'bcb_domestic_market_crosscheck_202609/**'
      - '.github/workflows/bcb_domestic_release_vintage_qa.yml'

permissions:
  contents: read

concurrency:
  group: bcb-domestic-release-vintage-qa
  cancel-in-progress: false

jobs:
  extract-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
        with:
          ref: research/bcb-priority-metadata-audit-20261117
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Compile extraction and manifest validator
        run: python -m py_compile scripts/research/extract_bcb_domestic_portfolio_release_vintage.py
      - name: Verify official workbook hashes and extract Table 10 vintage comparisons
        run: python scripts/research/extract_bcb_domestic_portfolio_release_vintage.py
      - name: Upload vintage comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: bcb-domestic-release-vintage-qa-${{ github.run_id }}
          path: data/qa/BCB_DOMESTIC_PORTFOLIO_RELEASE_VINTAGE_EXTRACT_20261117.json
          if-no-files-found: error
          retention-days: 90
