name: Audit-only Prospective Watchlist Tracking

on:
  workflow_dispatch:
  schedule:
    # 17:00 India time (11:30 UTC), weekdays; GitHub may delay scheduled starts.
    - cron: "30 11 * * 1-5"
  push:
    branches: [audit/prospective-selector-tracking]
    paths:
      - "prospective_watchlist_tracker.py"
      - "qa/**"
      - "pipeline/**"
      - "collector/**"
      - "requirements.txt"
      - "research/**"
      - "config/macro_factor_registry.csv"
      - ".github/workflows/prospective_watchlist_tracking.yml"

permissions:
  contents: write

concurrency:
  group: prospective-watchlist-audit
  cancel-in-progress: false

jobs:
  prospective-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated prospective audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/prospective-selector-tracking
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test corrected forward labels and prospective ledger
        run: python -m unittest discover -s qa -p "test_*.py" -v
      - name: Acquire normalized NSE history
        run: python collector/nse_download.py --sessions 200
      - name: Build normalized adaptive dataset
        run: python collector/build_200_sessions.py
      - name: Strict dataset QA
        run: python qa/validate_dataset.py
      - name: Collect quarterly results and board calendar (audit only)
        run: python pipeline/quarterly_results_research.py
      - name: Extract source-linked metrics from NSE XBRL attachments (audit only)
        run: python pipeline/quarterly_pdf_xbrl_metrics.py
      - name: Validate normalized quarterly metrics and build features (audit only)
        run: python pipeline/quarterly_results_research.py
      - name: Run corrected-label walk-forward audit only
        env:
          WF_SESSIONS: "100"
        run: python pipeline/walk_forward_backtest.py
      - name: Collect P0 market panel and timestamped geopolitical news (audit only)
        run: python pipeline/macro_geo_collect_p0.py
      - name: Repair four missing Macro-Geo P0 groups (audit only)
        run: python pipeline/macro_geo_repair_p0.py
      - name: Audit macro-geopolitical and sector source coverage (audit only)
        run: python pipeline/macro_geo_source_coverage.py
      - name: Run secondary historical macro/geo event study without blocking primary +5% audit
        run: |
          if python pipeline/macro_geo_event_study.py; then
            echo "Macro-Geo secondary study completed or explicitly reported research BLOCKED."
          else
            rc=$?
            echo "::warning::Macro-Geo secondary study exited ${rc}; inspect its report/artifact. Continuing the primary +5% H+1 audit."
          fi
      - name: Generate frozen-selector diagnostics (audit only)
        run: |
          python pipeline/hidden_winner_watchlist.py
          python pipeline/watchlist_selector_experiment.py
      - name: Compare last 20 fully matured historical cutoffs (exploratory only)
        run: python pipeline/historical_20_cutoff_paired_audit.py
      - name: Run Sep 16 anchored retrospective audit (exploratory only)
        run: python pipeline/sep16_anchor_retrospective_audit.py
      - name: Run multiple non-overlapping retrospective 20-session windows (exploratory only)
        run: python pipeline/multiwindow_retrospective_audit.py
      - name: Run strict target-specific 30 matured-cutoff historical audit (exploratory only)
        run: python pipeline/strict_30_matured_cutoff_audit.py
      - name: Run target-first +5% H+1 selector experiment (historical exploratory only)
        run: python pipeline/target5_h1_selector_experiment.py
      - name: Join quarterly results to frozen H+1 research candidates (audit only)
        run: python pipeline/quarterly_results_candidate_join.py
      - name: Collect timestamped stock-news discovery for frozen H+1 candidates (audit only)
        run: python pipeline/stock_news_24h_collect.py
      - name: Build stock-specific last-24-hour news join readiness (audit only)
        run: python pipeline/stock_news_24h_join.py
      - name: Repeat audit and verify byte-for-byte reproducibility (audit only)
        run: python pipeline/check_retrospective_audit_reproducibility.py
      - name: Enforce strict Macro-Geo hard gate before releasing prospective picks
        id: macro_geo_gate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python pipeline/macro_geo_hard_gate.py
          gate_rc=$?
          set -e
          if [ ! -s outputs/macro_geo/hard_gate_report.json ]; then
            echo "::error::Macro-Geo gate did not produce a report; this is a real workflow failure."
            exit 1
          fi
          gate_status="$(python -c 'import json; print(json.load(open("outputs/macro_geo/hard_gate_report.json")).get("status", "INVALID"))')"
          if [ "$gate_status" = "PASS" ] && [ "$gate_rc" -eq 0 ]; then
            echo "candidate_release_allowed=true" >> "$GITHUB_OUTPUT"
            echo "Macro-Geo gate PASS; candidate release may proceed."
          elif [ "$gate_status" = "BLOCKED" ] && [ "$gate_rc" -ne 0 ]; then
            echo "candidate_release_allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Research completed, but candidate release is BLOCKED by strict Macro-Geo hard gate. No prospective picks or ledger updates will be produced."
          else
            echo "::error::Unexpected Macro-Geo gate status/exit combination: status=$gate_status rc=$gate_rc"
            exit 1
          fi
      - name: Generate label-free picks from latest NSE session
        if: steps.macro_geo_gate.outputs.candidate_release_allowed == 'true'
        run: python pipeline/live_prospective_selector.py
      - name: Append picks and mature only complete outcomes
        if: steps.macro_geo_gate.outputs.candidate_release_allowed == 'true'
        run: python prospective_watchlist_tracker.py
      - name: Persist audit ledger with remote-branch reconciliation
        if: steps.macro_geo_gate.outputs.candidate_release_allowed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ledger="outputs/prospective/watchlist_ledger.csv"
          local_ledger="$RUNNER_TEMP/watchlist_ledger_local.csv"
          cp "$ledger" "$local_ledger"
          pushed=0
          for attempt in 1 2 3; do
            echo "LEDGER_PUSH_ATTEMPT=$attempt"
            git fetch origin audit/prospective-selector-tracking
            git reset --hard origin/audit/prospective-selector-tracking
            python - "$local_ledger" "$ledger" <<'PY'
          import sys
          from pathlib import Path
          import pandas as pd
          local_path, remote_path = map(Path, sys.argv[1:])
          local = pd.read_csv(local_path, dtype={"CUT_OFF": str, "SYMBOL": str, "SELECTOR": str})
          if remote_path.exists():
              remote = pd.read_csv(remote_path, dtype={"CUT_OFF": str, "SYMBOL": str, "SELECTOR": str})
          else:
              remote = local.iloc[0:0].copy()
          key = ["CUT_OFF", "SYMBOL", "SELECTOR"]
          outcomes = ["T1_HIGH_PCT", "T3_HIGH_PCT", "T5_HIGH_PCT", "T5_H1_HIT",
                      "T10_H3_HIT", "T20_H5_HIT", "MATURED_T1", "MATURED_T3",
                      "MATURED_T5", "OUTCOME_LAST_DATE"]
          columns = list(dict.fromkeys(list(remote.columns) + list(local.columns)))
          for col in columns:
              if col not in remote: remote[col] = pd.NA
              if col not in local: local[col] = pd.NA
          remote, local = remote[columns], local[columns]
          if not remote.empty and remote.duplicated(key).any():
              raise SystemExit("Remote ledger has duplicate keys; refusing automatic reconciliation")
          remote_idx = {tuple(str(row[k]) for k in key): i for i, row in remote.iterrows()}
          for _, row in local.iterrows():
              k = tuple(str(row[c]) for c in key)
              if k not in remote_idx:
                  remote = pd.concat([remote, row.to_frame().T], ignore_index=True)
                  remote_idx[k] = remote.index[-1]
                  continue
              i = remote_idx[k]
              for col in outcomes:
                  old, new = remote.at[i, col], row[col]
                  old_empty = pd.isna(old) or str(old).strip() == ""
                  new_empty = pd.isna(new) or str(new).strip() == ""
                  if old_empty and not new_empty:
                      remote.at[i, col] = new
          remote = remote.sort_values(key).reset_index(drop=True)
          remote.to_csv(remote_path, index=False)
          PY
            git add "$ledger"
            if git diff --cached --quiet; then
              echo "No new ledger changes to persist."
              pushed=1
              break
            fi
            git commit -m "Audit: update prospective selector ledger"
            if git push origin HEAD:audit/prospective-selector-tracking; then
              pushed=1
              break
            fi
            echo "::warning::Ledger push raced with another branch update; reconciling again."
          done
          if [ "$pushed" -ne 1 ]; then
            echo "::error::Unable to persist ledger after three remote reconciliations."
            exit 1
          fi
      - name: Upload prospective audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prospective-watchlist-audit
          path: |
            data/qa/qa_report.json
            outputs/prospective/watchlist_ledger.csv
            outputs/prospective/latest_picks.csv
            outputs/backtest/walk_forward_metrics.json
            outputs/backtest/watchlist_selector_experiment_summary.json
            outputs/prospective/historical_20_cutoff_paired_comparison.json
            outputs/prospective/historical_20_cutoff_daily.csv
            outputs/prospective/sep16_anchor_retrospective_audit.json
            outputs/prospective/sep16_anchor_retrospective_daily.csv
            outputs/prospective/multiwindow_retrospective_audit.json
            outputs/prospective/multiwindow_retrospective_daily.csv
            outputs/prospective/strict_30_matured_cutoff_audit.json
            outputs/prospective/strict_30_matured_cutoff_daily.csv
            outputs/prospective/target5_h1_selector_experiment.json
            outputs/prospective/target5_h1_selector_experiment_daily.csv
            outputs/prospective/target5_h1_selector_experiment_picks.csv
            outputs/news_24h/stock_news_collection_report.json
            outputs/news_24h/stock_news_24h_readiness.json
            outputs/macro_geo/hard_gate_report.json
            data/raw/quarterly_results_disclosures.csv
            data/raw/quarterly_results_raw_responses/*.json
            outputs/quarterly_results/source_validation_report.csv
            data/raw/quarterly_financial_metrics.csv
            data/raw/quarterly_results_calendar.csv
            outputs/quarterly_results/quarterly_financial_features.csv
            outputs/quarterly_results/quarterly_results_event_study.csv
            outputs/quarterly_results/quarterly_results_research_report.json
            outputs/quarterly_results/filing_metric_extraction_report.json
            data/raw/quarterly_filing_evidence/*.pdf
            data/raw/quarterly_filing_evidence/*.xbrl
            data/raw/quarterly_filing_evidence/*.txt
            outputs/macro_geo/p0_repair_report.json
            data/external/brent_crude.csv
            data/external/usd_inr.csv
            data/external/fpi_dii_flows.csv
            data/external/corporate_events.csv
            outputs/quarterly_results/target5_h1_quarterly_catalyst_join.csv
            outputs/quarterly_results/target5_h1_quarterly_catalyst_join_report.json
            data/raw/stock_news_events.csv
            data/raw/stock_news_coverage.csv
            outputs/news_24h/stock_news_24h_cutoff_join.csv
            outputs/prospective/reproducibility_check.json
            outputs/macro_geo/p0_collection_manifest.json
            outputs/macro_geo/source_coverage.json
            outputs/macro_geo/source_coverage.csv
            outputs/macro_geo/event_study_report.json
            outputs/macro_geo/event_study_summary.csv
            outputs/macro_geo/event_study_windows.csv
          if-no-files-found: warn
