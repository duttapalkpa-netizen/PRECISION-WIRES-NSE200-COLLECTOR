name: BCB Portfolio Asset Flow Identity (Research Only)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bcb_asset_flow_identity.yml"
      - "scripts/research/validate_bcb_asset_flow_identity.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture and test both official asset-flow sign conventions
        run: python scripts/research/validate_bcb_asset_flow_identity.py
      - name: Upload raw sources and monthly identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bcb-asset-identity-${{ github.run_id }}
          path: artifacts/bcb_asset_identity/
          if-no-files-found: error
          retention-days: 90
