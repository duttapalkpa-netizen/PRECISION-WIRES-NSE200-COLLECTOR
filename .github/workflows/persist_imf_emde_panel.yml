name: Persist IMF BOP EMDE Portfolio Panel Evidence
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research/persist_imf_emde_panel_trigger.txt"
permissions:
  contents: write
  actions: read
jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download verified 154-member panel and exact-key checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44474620936 --repo "$GITHUB_REPOSITORY" --name "imf-bop-emde-portfolio-flows-44474620936" --dir /tmp/emde
          gh run download 44474629873 --repo "$GITHUB_REPOSITORY" --name "weo-october-2026-emde-membership-44474629873" --dir /tmp/weo
          gh run download 44474458684 --repo "$GITHUB_REPOSITORY" --name "imf-emde-exact-sample-validation-44474458684" --dir /tmp/exact
          gh run download 44475089564 --repo "$GITHUB_REPOSITORY" --name "imf-emde-quarterly-coverage-qa-44475089564" --dir /tmp/coverage
          gh run download 44475051442 --repo "$GITHUB_REPOSITORY" --name "imf-bop-scale-semantics-44475051442" --dir /tmp/scale
      - name: Persist raw CSVs, normalized panel, coverage and receipts
        run: |
          DEST=docs/evidence/imf_bop_emde_20261119
          mkdir -p "$DEST/raw" "$DEST/exact_sample_checks"
          cp /tmp/emde/emde_membership.csv "$DEST/"
          cp /tmp/emde/coverage_by_country_entry.csv "$DEST/"
          cp /tmp/emde/emde_portfolio_flows.csv "$DEST/"
          cp /tmp/emde/summary.json "$DEST/"
          cp /tmp/emde/provenance.json "$DEST/"
          cp /tmp/emde/raw/WEOOct2026all.xlsx "$DEST/raw/"
          cp /tmp/emde/raw/CL_BOP_COUNTRY.xml "$DEST/raw/"
          mkdir -p "$DEST/weo_membership_validation/raw"
          cp /tmp/weo/summary.json "$DEST/weo_membership_validation/"
          cp /tmp/weo/weo_emde_appendix_to_bop_iso3_crosswalk.csv "$DEST/weo_membership_validation/"
          cp /tmp/weo/weo_oct2026_emde_membership.csv "$DEST/weo_membership_validation/"
          cp /tmp/weo/raw/weo_appendix.pdf "$DEST/weo_membership_validation/raw/"
          cp /tmp/weo/raw/weo_workbook.xlsx "$DEST/weo_membership_validation/raw/"
          cp /tmp/weo/raw/bop_country_codelist.xml "$DEST/weo_membership_validation/raw/"
          mkdir -p "$DEST/coverage_qa" "$DEST/scale_semantics"
          cp /tmp/coverage/*.csv "$DEST/coverage_qa/"
          cp /tmp/coverage/summary.json "$DEST/coverage_qa/"
          cp /tmp/coverage/report.md docs/GCR_IMF_BOP_EMDE_COVERAGE_QA_PART3_20261119.md
          cp /tmp/scale/bop_dsd.xml "$DEST/scale_semantics/"
          cp /tmp/scale/master_concept_scheme.xml "$DEST/scale_semantics/"
          cp /tmp/scale/unit_multiplier_codelist.xml "$DEST/scale_semantics/"
          cp /tmp/scale/summary.json "$DEST/scale_semantics/"
          cat > docs/GCR_IMF_BOP_SCALE_SEMANTICS_20261119.md <<'EOF'
# IMF BOP SCALE metadata resolution — 2026-11-19

- DSD: `IMF.STA:DSD_BOP(24.0.0)`; optional attribute `SCALE` is present and its `ConceptIdentity` points to `IMF:CS_MASTER_SYSTEM(1.0.2).SCALE`.
- Exact concept `SCALE` enumerates `IMF:CL_UNIT_MULT(1.0+.0)`; latest public codelist response `CL_UNIT_MULT(1.0.2)` has code `6` labelled **Millions**, description `10^6`.
- SDMX glossary defines unit multiplier as the base-10 exponent used to calculate the actual value in the unit of measure; `6` means observations are in millions. This establishes metadata semantics, not proof that the IMF Data Portal CSV response requires a second multiplication.
- All 9,299 panel observations carry `UNIT=USD` and `SCALE=6`; preserve both exactly. Example raw values are already large in absolute USD magnitude, so mechanically multiplying by 10^6 would produce implausible values for several countries. This is a source/API normalization question requiring direct IMF portal display and national-source reconciliation.
- Decision: **SCALE code meaning PASS; numeric transformation BLOCKED.** No multiply/divide, rescaling, FX conversion, netting or aggregate is authorized. Raw `OBS_VALUE` remains unchanged.
- Capture: run 44475051442; artifact 14505852262; ZIP SHA-256 `391981ce19d89d8ccc6377580e33345a9d75adffdc3f4197c4e4c743a66e3cf3`.
- Raw DSD XML SHA-256 `5953ac8b3a52fae9cd7c5821621446d046969bcef0e88540ef17520c2d39b098`; master concept scheme SHA-256 `e753812c45b8159c77e191f091c63d5364375f57daca179da9799040de48e568`; CL_UNIT_MULT SHA-256 `40a911ecceb0b96ff0ee2a166af3c2512f19fbbfca50e71b2e47936cad3bac78`.
EOF
          cp /tmp/emde/raw/EMDE_A_NFA_T_P_F_ALL_UNITS_Q.csv "$DEST/raw/"
          cp /tmp/emde/raw/EMDE_L_NIL_T_P_F_ALL_UNITS_Q.csv "$DEST/raw/"
          cp /tmp/exact/summary.json "$DEST/exact_sample_checks/"
          cp /tmp/exact/raw/*.csv "$DEST/exact_sample_checks/"
          cat > "$DEST/source_artifact_receipt.json" <<'EOF'
          {
            "panel_workflow_run_id": 44474620936,
            "panel_artifact_id": 14505452613,
            "panel_artifact_sha256": "b23854fa433b46b29bb2d8094ec9bc14d2cd6c58fdc1771fa9428ca6ae3aed17",
            "sample_validation_workflow_run_id": 44474458684,
            "sample_validation_artifact_id": 14505009889,
            "sample_validation_artifact_sha256": "588101c0deff3b4310984dae5eabcac64fc8288f4416854b7676b4b6ff6b4cd7",
            "weo_october_2026_workbook_sha256": "2aa4f70a05931197b41ed7e0202dc56eee8d816858ac14521e4f8f5dbc38696c",
            "weo_october_2026_appendix_sha256": "cd4e2829d7e621d43134728bfc128547f776e909e08ef1d38b837e2d39e5ae2a",
            "weo_membership_workflow_run_id": 44474629873,
            "weo_membership_artifact_id": 14506160317,
            "weo_membership_artifact_sha256": "acdf014f5f19ba5e0d23dca7a8d57a4b1813b002a3274495d557f0cd05c0fbb1",
            "imf_bop_country_codelist_sha256": "190c0ab3196a85bba890e2fd0cf40eebda654de2eb8e7d1f16c9644572d59f39",
            "authentication": "none; public anonymous GET",
            "validation": "WEO Appendix vs same-vintage G200 workbook 154/154; all 154 ISO3 present in BOP codelist; 9,299 unique observations; 24 exact queries; 1,106/1,106 observation/attribute matches; raw-to-normalized row multiset 9,299/9,299; coverage QA 225/308 country-entry pairs, 40 no-data countries, 13 series with internal gaps; SCALE code 6=Millions, numeric conversion blocked"
          }
          EOF
      - name: Commit durable EMDE evidence archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/imf_bop_emde_20261119
          git commit -m "Archive WEO EMDE IMF BOP portfolio flow panel and exact checks"
          git pull --rebase origin main
          git push origin main
