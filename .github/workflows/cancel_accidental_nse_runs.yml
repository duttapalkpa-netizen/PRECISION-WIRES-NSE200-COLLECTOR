name: Cancel accidental research-triggered NSE runs
on:
  push:
    paths:
      - "scripts/research/cancel_accidental_nse_runs_trigger.txt"
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel unintended collector runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 44494746703 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 44495237321 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 44495240272 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 44494753220 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 44484649213 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 44484666061 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 44485482464 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 44493879791 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 44689517549 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 44690020188 --repo "$GITHUB_REPOSITORY" || true
          gh run cancel 44690030398 --repo "$GITHUB_REPOSITORY" || true
