name: IMF WEO October 2026 Membership Source Capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/research/imf_weo_membership_capture_trigger.txt"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install XLSX reader
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Capture official WEO October 2026 workbook
        run: python scripts/research/capture_imf_weo_oct2026_membership_source.py
      - name: Upload workbook and source inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imf-weo-oct2026-membership-source-${{ github.run_id }}
          path: imf_weo_oct2026_evidence/
          if-no-files-found: warn
          retention-days: 90
