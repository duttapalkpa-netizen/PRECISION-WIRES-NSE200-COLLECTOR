name: Validate Macro Evidence Snapshot v2
on:
  pull_request:
    branches: [main]
    paths:
      - "pipeline/build_macro_indicator_evidence_snapshot.py"
      - "qa/test_macro_indicator_evidence_snapshot.py"
      - ".github/workflows/macro_evidence_snapshot_v2.yml"
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Download pinned evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/macro_evidence/{gdp,cpi,wpi,capex,pmi}
          gh run download 41285765677 -n mospi-nas-gdp-bounded-live-smoke -D inputs/macro_evidence/gdp
          gh run download 41286559713 -n mospi-cpi-2024-bounded-live-smoke -D inputs/macro_evidence/cpi
          gh run download 41287256251 -n oea-wpi-2022-23-september-live-smoke -D inputs/macro_evidence/wpi
          gh run download 41287828206 -n cga-capex-fy2026-27-september-live-smoke -D inputs/macro_evidence/capex
          gh run download 41287685168 -n pmi-source-access-assessment -D inputs/macro_evidence/pmi
          gh run download 41282726166 -n macro-geo-factor-source-repair -D .
          test -s outputs/macro_geo/source_coverage.json
          test -s outputs/macro_geo/factor_source_collection_report.json
      - name: Run fail-closed regression tests
        run: PYTHONPATH=. python -m unittest qa.test_macro_indicator_evidence_snapshot -v
      - name: Build snapshot and audit 35 factors
        run: python pipeline/build_macro_indicator_evidence_snapshot.py
      - name: Assert same-snapshot and hard-gate policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("outputs/macro_geo")
          s=json.loads((p/"macro_indicator_evidence_snapshot.json").read_text())
          c=json.loads((p/"source_coverage.json").read_text())
          a=json.loads((p/"factor_coverage_audit.json").read_text())
          assert s["status"]=="SAME_SNAPSHOT_AUDIT_PASS_WITH_GAPS"
          assert s["snapshot_as_of_utc"]==c["as_of_utc"]==a["source_coverage_as_of"]
          assert s["factor_groups"]==35
          assert s["macro_indicators_status"]=="DATA_QUALITY_WARN"
          assert s["government_capex_status"]=="DATA_QUALITY_WARN"
          assert s["pmi_underlying_dataset_status"]=="NOT_CONNECTED"
          assert s["hard_gate"]=="BLOCKED"
          print({"same_snapshot":"PASS","factor_groups":35,"fully_available":s["fully_available_schema_groups"],"partial":s["partial_source_coverage"],"not_connected":s["not_connected"],"hard_gate":"BLOCKED"})
          PY
      - name: Upload reproducible evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-indicator-evidence-same-snapshot-v2
          path: |
            inputs/macro_evidence/
            outputs/macro_geo/source_coverage.json
            outputs/macro_geo/factor_coverage_audit.csv
            outputs/macro_geo/factor_coverage_audit.json
            outputs/macro_geo/macro_indicator_evidence_snapshot.json
            outputs/macro_geo/macro_indicator_evidence_snapshot_manifest.json
          if-no-files-found: warn
