name: NSE 200-Session Collector Benchmark

on:
  push:
    branches:
      - fix/factor-registry-same-snapshot-reconcile
    paths:
      - "collector/nse_download.py"
      - "collector/nse_snapshot_manifest.py"
      - "collector/nse_warm_cache_benchmark.py"
      - "tests/test_nse_snapshot_manifest.py"
      - "tests/test_nse_warm_cache_benchmark.py"
      - ".github/workflows/nse-200-session-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nse-200-session-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore incremental NSE raw-session cache
        id: raw_cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nse-raw-benchmark-v1-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            nse-raw-benchmark-v1-${{ github.ref_name }}-
      - name: Record cache verification start
        run: |
          mkdir -p data/qa
          date -u +%Y-%m-%dT%H:%M:%SZ | tee data/qa/benchmark_started_at_utc.txt
          python -c "import time; print(time.time_ns())" > data/qa/benchmark_started_epoch_ns.txt
          printf 'CACHE_HIT=%s\\n' "${{ steps.raw_cache.outputs.cache-hit }}" | tee data/qa/cache_restore_status.txt
          printf 'CACHE_RESTORED_KEY=%s\\n' "${{ steps.raw_cache.outputs.cache-matched-key }}" | tee -a data/qa/cache_restore_status.txt
      - name: Repair cache using date-validated incremental collector
        run: python collector/nse_download.py --sessions 200 --lookback-days 500 --out data/raw
      - name: Persist repaired incremental NSE cache
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: nse-raw-benchmark-v1-${{ github.ref_name }}-${{ github.run_id }}
      - name: Verify repaired cache contains exactly 200 sessions
        run: |
          test -f data/raw/sessions.txt
          python - <<'PY'
          from pathlib import Path
          from datetime import date
          import sys
          dates = [x.strip() for x in Path("data/raw/sessions.txt").read_text().splitlines() if x.strip()]
          unique = sorted(set(dates))
          matched = [d for d in unique if (Path("data/raw") / ("sec_bhavdata_full_" + date.fromisoformat(d).strftime("%d%m%Y") + ".csv")).is_file()]
          print(f"INDEXED_SESSIONS={len(dates)}")
          print(f"UNIQUE_SESSIONS={len(unique)}")
          print(f"MATCHING_SESSION_CSVS={len(matched)}")
          if len(dates) != 200 or len(unique) != 200 or len(matched) != 200:
              print("BLOCKED: repaired cache is incomplete.")
              sys.exit(1)
          PY
      - name: Run exact 200-session warm-cache benchmark
        run: |
          PYTHONPATH=. /usr/bin/time -v -o data/qa/warm_cache_time.txt python -m collector.nse_warm_cache_benchmark --raw-dir data/raw --sessions 200 --output data/qa/nse_warm_cache_benchmark.json
      - name: Freeze and validate immutable 200-session snapshot
        run: python collector/nse_snapshot_manifest.py --raw-dir data/raw --sessions 200 | tee data/qa/snapshot_manifest_result.json
      - name: Record benchmark finish
        if: always()
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ | tee data/qa/benchmark_finished_at_utc.txt
          python -c "import time; print(time.time_ns())" > data/qa/benchmark_finished_epoch_ns.txt
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-200-session-cache-verification-${{ github.run_number }}
          path: |
            data/raw/sessions.txt
            data/raw/*.csv
            data/raw/acquisition_diagnostics.json
            data/raw/nse_snapshot_manifest_*.json
            data/qa/
          if-no-files-found: warn
          retention-days: 30
