name: Brazil IMF BOP Scale Reconciliation Evidence
on:
  push:
    paths:
      - "scripts/research/bcb_scale_reconciliation_trigger.txt"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load archived IMF Brazil exact series
        run: |
          mkdir -p imf_bop_portfolio_exact_panel
          cp docs/evidence/imf_bop_20261119/BRA_A_NFA_T_P_F_USD_Q.csv imf_bop_portfolio_exact_panel/
          cp docs/evidence/imf_bop_20261119/BRA_L_NIL_T_P_F_USD_Q.csv imf_bop_portfolio_exact_panel/
      - name: Capture official BCB monthly data and reconcile five quarters
        run: python scripts/research/reconcile_imf_bop_scale_brazil_bcb.py
      - name: Upload raw BCB responses and reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brazil-imf-bcb-scale-reconciliation-${{ github.run_id }}
          path: bcb_scale_reconciliation/
          if-no-files-found: error
          retention-days: 90
      - name: Persist BCB raw source and reconciliation to GitHub
        run: |
          DEST=docs/evidence/imf_bop_20261119/bcb_scale_reconciliation
          mkdir -p "$DEST/raw"
          cp bcb_scale_reconciliation/raw/*.json "$DEST/raw/"
          cp bcb_scale_reconciliation/quarter_reconciliation.csv "$DEST/"
          cp bcb_scale_reconciliation/quarter_reconciliation.json "$DEST/"
          cp bcb_scale_reconciliation/summary.json "$DEST/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if ! git diff --cached --quiet; then
            git commit -m "Archive Brazil IMF BOP scale reconciliation against BCB"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
