name: IMF BOP Public Route Probe
on:
  push:
    paths:
      - 'scripts/research/imf_bop_public_route_probe_trigger.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official IMF BOP landing pages and public SDMX metadata routes
        run: python scripts/research/probe_imf_bop_public_routes.py
      - name: Fetch exact BOP DSD concept scheme and codelists
        run: python scripts/research/fetch_imf_bop_dsd_codelists.py
      - name: Probe public IMF master-system SCALE concept routes
        run: python scripts/research/probe_imf_scale_concept_routes.py
      - name: Query exact-key Brazil and India portfolio investment BOP observations
        run: python scripts/research/smoke_test_imf_bop_observations.py
      - name: Run bounded broad-key BOP observation diagnostics
        run: python scripts/research/probe_imf_bop_broad_observation_queries.py
      - name: Capture exact Brazil and India portfolio-investment flow panel
        run: python scripts/research/capture_imf_bop_portfolio_panel.py
      - name: Compare BCB registered XML with IMF Brazil BOP panel
        run: python scripts/research/compare_bcb_xml_to_imf_bop_panel.py
      - name: Reconcile Brazil IMF scale and signs against official BCB monthly portfolio flows
        run: python scripts/research/reconcile_imf_bop_scale_brazil_bcb.py
      - name: Independently reconcile exact BOP panel against broad raw observations
        run: python scripts/research/validate_imf_bop_portfolio_panel.py

      - name: Commit durable IMF BOP pilot evidence (raw DSD + exact CSV panel)
        continue-on-error: true
        run: |
          mkdir -p docs/evidence/imf_bop_20261119
          cp imf_bop_public_route_probe/api_imf_bop_dataflow_v3.xml docs/evidence/imf_bop_20261119/
          cp imf_bop_dsd_codelists/DSD_BOP.xml docs/evidence/imf_bop_20261119/IMF_STA_DSD_BOP_24_0_0_references_all.xml
          cp imf_bop_dsd_codelists/CS_MASTER_SYSTEM.xml docs/evidence/imf_bop_20261119/
          cp imf_bop_dsd_codelists/CL_UNIT_MULT.xml docs/evidence/imf_bop_20261119/
          cp imf_scale_concept_route_probe/summary.json docs/evidence/imf_bop_20261119/scale_concept_route_summary.json
          cp imf_bop_portfolio_exact_panel/portfolio_flows_panel.csv docs/evidence/imf_bop_20261119/
          cp imf_bop_portfolio_exact_panel/BRA_A_NFA_T_P_F_USD_Q.csv docs/evidence/imf_bop_20261119/
          cp imf_bop_portfolio_exact_panel/BRA_L_NIL_T_P_F_USD_Q.csv docs/evidence/imf_bop_20261119/
          cp imf_bop_portfolio_exact_panel/IND_A_NFA_T_P_F_USD_Q.csv docs/evidence/imf_bop_20261119/
          cp imf_bop_portfolio_exact_panel/IND_L_NIL_T_P_F_USD_Q.csv docs/evidence/imf_bop_20261119/
          cp imf_bop_portfolio_exact_panel/summary.json docs/evidence/imf_bop_20261119/
          cp imf_bop_portfolio_panel_validation/validation.json docs/evidence/imf_bop_20261119/
          cp bcb_bop_scale_crosscheck/bcb_bop_bpm6.xml docs/evidence/imf_bop_20261119/
          cp bcb_bop_scale_crosscheck/summary.json docs/evidence/imf_bop_20261119/bcb_scale_crosscheck_summary.json
          cp bcb_bop_scale_crosscheck/comparison.csv docs/evidence/imf_bop_20261119/bcb_imf_bop_value_comparison.csv
          cp imf_bop_observation_smoketest/summary.json docs/evidence/imf_bop_20261119/p_mv_rejected_smoketest.json
          cp imf_bop_public_route_probe/manifest.json docs/evidence/imf_bop_20261119/public_route_manifest.json
          mkdir -p docs/evidence/imf_bop_20261119/bcb_scale_reconciliation
          cp bcb_scale_reconciliation/raw/*.json docs/evidence/imf_bop_20261119/bcb_scale_reconciliation/
          cp bcb_scale_reconciliation/quarter_reconciliation.csv docs/evidence/imf_bop_20261119/bcb_scale_reconciliation/
          cp bcb_scale_reconciliation/quarter_reconciliation.json docs/evidence/imf_bop_20261119/bcb_scale_reconciliation/
          cp bcb_scale_reconciliation/summary.json docs/evidence/imf_bop_20261119/bcb_scale_reconciliation/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/imf_bop_20261119
          if ! git diff --cached --quiet; then
            git commit -m "Archive IMF BOP Brazil India portfolio flow pilot evidence"
            git pull --rebase origin main
            git push
          fi
      - name: Upload raw responses and manifest
        uses: actions/upload-artifact@v4
        with:
          name: imf-bop-public-route-probe-${{ github.run_id }}
          path: |
            imf_bop_public_route_probe/
            imf_bop_dsd_codelists/
            imf_scale_concept_route_probe/
            imf_bop_observation_smoketest/
            imf_bop_broad_probe/
            imf_bop_portfolio_exact_panel/
            imf_bop_portfolio_panel_validation/
            bcb_bop_scale_crosscheck/
            bcb_scale_reconciliation/
          if-no-files-found: error
          retention-days: 90
