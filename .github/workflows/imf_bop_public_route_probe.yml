name: IMF BOP Public Route Probe
on:
  push:
    paths:
      - 'scripts/research/imf_bop_public_route_probe_trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official IMF BOP landing pages and public SDMX metadata routes
        run: python scripts/research/probe_imf_bop_public_routes.py
      - name: Fetch exact BOP DSD concept scheme and codelists
        run: python scripts/research/fetch_imf_bop_dsd_codelists.py
      - name: Query exact-key Brazil and India portfolio investment BOP observations
        run: python scripts/research/smoke_test_imf_bop_observations.py
      - name: Upload raw responses and manifest
        uses: actions/upload-artifact@v4
        with:
          name: imf-bop-public-route-probe-${{ github.run_id }}
          path: |
            imf_bop_public_route_probe/
            imf_bop_dsd_codelists/
            imf_bop_observation_smoketest/
          if-no-files-found: error
          retention-days: 90
