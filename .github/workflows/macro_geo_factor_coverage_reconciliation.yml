name: Factor Coverage Reconciliation
on:
  workflow_run:
    workflows: ["Bounded Factor Source Repair (separate from P0; evidence-only)"]
    types: [completed]
    branches: [audit/run145-factor-registry-gap-audit]
permissions:
  contents: read
  actions: read
concurrency:
  group: factor-coverage-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'audit/run145-factor-registry-gap-audit' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout the exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download evidence from the exact successful source-repair run
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          test "$TRIGGER_BRANCH" = "audit/run145-factor-registry-gap-audit"
          test -n "$TRIGGER_RUN_ID"
          test -n "$TRIGGER_HEAD_SHA"
          mkdir -p outputs/macro_geo data/external
          gh run download "$TRIGGER_RUN_ID" -n macro-geo-factor-source-repair -D /tmp/factor-evidence
          cp -a /tmp/factor-evidence/. .
          test -s outputs/macro_geo/source_coverage.json
          test -s outputs/macro_geo/factor_source_collection_report.json
          test -s data/external/us_yields.csv || true
          echo "Reconciliation input is bound to triggering run $TRIGGER_RUN_ID at $TRIGGER_HEAD_SHA"
      - name: Reconcile one immutable evidence snapshot
        run: python pipeline/macro_geo_factor_coverage_reconcile.py
      - name: Audit all registered factors from the reconciled snapshot
        run: python pipeline/macro_geo_factor_coverage_audit.py
      - name: Assert snapshot timestamp consistency
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("outputs/macro_geo")
          coverage=json.loads((root/"source_coverage.json").read_text())
          audit=json.loads((root/"factor_coverage_audit.json").read_text())
          assert coverage.get("as_of_utc"), "source coverage missing as_of_utc"
          assert audit.get("source_coverage_as_of") == coverage["as_of_utc"], "factor audit is not tied to source coverage snapshot"
          assert audit.get("factor_groups") == 35, f"expected 35 factor groups, got {audit.get('factor_groups')}"
          print({"status":audit.get("status"),"factor_groups":audit.get("factor_groups"),
                 "source_coverage_as_of":coverage["as_of_utc"],"snapshot_consistency":"PASS"})
          PY
      - name: Upload reconciled coverage and factor audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-geo-factor-coverage-reconciliation
          path: |
            outputs/macro_geo/source_coverage.json
            outputs/macro_geo/factor_source_collection_report.json
            outputs/macro_geo/factor_coverage_audit.csv
            outputs/macro_geo/factor_coverage_audit.json
          if-no-files-found: warn
