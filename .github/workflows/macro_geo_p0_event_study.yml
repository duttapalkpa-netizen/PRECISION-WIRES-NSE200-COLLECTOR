name: Audit-only Macro Geo P0 Collection and Event Study

on:
  workflow_dispatch:
  push:
    branches: [audit/prospective-selector-tracking]
    paths:
      - "pipeline/macro_geo_collect_p0.py"
      - "pipeline/macro_geo_repair_p0.py"
      - "pipeline/quarterly_results_research.py"
      - "qa/test_macro_geo_repair_p0.py"
      - "pipeline/macro_geo_source_coverage.py"
      - "pipeline/macro_geo_four_group_validation.py"
      - "pipeline/macro_geo_factor_coverage_audit.py"
      - "pipeline/macro_geo_event_study.py"
      - "pipeline/historical_regime_event_study.py"
      - "pipeline/sector_rotation_features.py"
      - "config/macro_factor_registry.csv"
      - "config/macro_geo_data_gap_register.csv"
      - "config/macro_geo_historical_regimes.csv"
      - "config/macro_geo_sector_transmission_map.csv"
      - "qa/test_macro_geo_engine.py"
      - "collector/**"
      - "requirements.txt"
      - ".github/workflows/macro_geo_p0_event_study.yml"

permissions:
  contents: read

concurrency:
  group: macro-geo-p0-audit-v5
  cancel-in-progress: true

jobs:
  macro-geo-p0:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout audit branch only
        uses: actions/checkout@v4
        with:
          ref: audit/prospective-selector-tracking
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test event-study timestamp and data-quality logic
        run: python -m unittest qa.test_macro_geo_engine -v
      - name: Collect P0 market series and timestamped media evidence
        run: python pipeline/macro_geo_collect_p0.py
      - name: Collect NSE corporate disclosures for P0 event normalization
        if: always()
        run: python pipeline/quarterly_results_research.py
      - name: Run bounded P0 source repair (FRED plus preserved NSE disclosures and official FPI/DII)
        if: always()
        run: python pipeline/macro_geo_repair_p0.py
      - name: Audit source coverage and data quality
        run: python pipeline/macro_geo_source_coverage.py
      - name: Strictly validate benchmark, sector, volatility and geopolitical groups
        if: always()
        run: python pipeline/macro_geo_four_group_validation.py
      - name: Audit all registered factors against observed source coverage
        run: python pipeline/macro_geo_factor_coverage_audit.py
      - name: Run sourced publication-time event study
        run: python pipeline/macro_geo_event_study.py
      - name: Run historical regime and sector-relative study
        run: python pipeline/historical_regime_event_study.py
      - name: Build daily sector rotation features
        run: python pipeline/sector_rotation_features.py
      - name: Upload P0 data and audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-geo-p0-event-study
          path: |
            data/external/market_panel.csv
            data/external/events.csv
            data/external/geopolitical_events.csv
            data/external/benchmark_indices.csv
            data/external/sector_indices.csv
            data/external/volatility.csv
            data/external/brent_crude.csv
            data/external/usd_inr.csv
            data/external/us_yields.csv
            data/external/us_real_yields.csv
            data/external/dxy.csv
            data/external/commodity_prices.csv
            data/external/fx_carry.csv
            data/external/corporate_events.csv
            data/external/fpi_dii_flows.csv
            outputs/macro_geo/**
            config/macro_geo_historical_regimes.csv
            config/macro_geo_sector_transmission_map.csv
          if-no-files-found: warn
