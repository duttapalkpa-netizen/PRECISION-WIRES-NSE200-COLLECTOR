name: Sector Fundamentals Factor Registry Partial Evidence Reconciliation
on:
  push:
    branches:
      - fix/factor-registry-same-snapshot-reconcile
    paths:
      - '.github/workflows/sector_fundamentals_factor_registry_reconciliation.yml'
      - 'pipeline/sector_fundamentals_source_coverage_reconcile.py'
      - 'qa/test_sector_fundamentals_source_coverage_reconcile.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: sector-fundamentals-factor-registry-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout conservative reconciliation code
        uses: actions/checkout@v4
        with:
          ref: fix/factor-registry-same-snapshot-reconcile
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependency
        run: python -m pip install 'pandas>=2.2,<3'
      - name: Download exact Factor Registry and NIC-2 evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/factor_baseline inputs/sector_iip outputs/macro_geo data/external
          gh run download 41585579135 -n nse-factor-registry-snapshot-reconciliation -D inputs/factor_baseline
          gh run download 41588832612 -n sector-fundamentals-nic2-iip-partial-evidence -D inputs/sector_iip
          test -s inputs/factor_baseline/source_coverage.json
          test -s inputs/factor_baseline/nse_factor_registry_evidence_manifest.json
          test -s inputs/sector_iip/data/external/sector_fundamentals.csv
          cp inputs/factor_baseline/source_coverage.json outputs/macro_geo/source_coverage.json
          cp inputs/factor_baseline/nse_factor_registry_evidence_manifest.json outputs/macro_geo/
          cp inputs/sector_iip/data/external/sector_fundamentals.csv data/external/
          cp inputs/sector_iip/outputs/macro_geo/sector_fundamentals_iip_adapter_qa.json outputs/macro_geo/
          python - <<'PY'
          import json,subprocess,os
          repo=os.environ['GITHUB_REPOSITORY']
          pins=[
            (41585579135,13207244042,'sha256:570d6b74c0f79e1f1a3b0aa26fd933abe9d58ef11355724aa14a2ad2b4cea17e'),
            (41588832612,13208982532,'sha256:191f0b8ec882d5316e8476c37e545a60c2c4817137dc98a59e2d521080665fdc')
          ]
          for run,aid,digest in pins:
            meta=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}'],text=True))
            assert meta['conclusion']=='success'
            arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run}/artifacts'],text=True))['artifacts']
            a=next(x for x in arts if x['id']==aid)
            assert a['digest']==digest and not a['expired'],a
            print({'run_id':run,'artifact_id':aid,'digest_verified':True})
          PY
      - name: Run source coverage reconciliation regression tests
        run: python -m unittest -v qa.test_sector_fundamentals_source_coverage_reconcile
      - name: Record NIC-2 evidence as DATA_QUALITY_WARN only
        run: python pipeline/sector_fundamentals_source_coverage_reconcile.py
      - name: Re-audit all 35 Factor Registry groups and rebuild gap priority
        run: |
          python pipeline/macro_geo_factor_coverage_audit.py
          python pipeline/factor_registry_gap_priority_audit.py
      - name: Assert fail-closed factor states and bind new evidence vintage
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('outputs/macro_geo')
          c=json.loads((root/'source_coverage.json').read_text())
          a=json.loads((root/'factor_coverage_audit.json').read_text())
          p=json.loads((root/'factor_gap_priority_audit.json').read_text())
          base=json.loads((root/'nse_factor_registry_evidence_manifest.json').read_text())
          sector=next(x for x in c['sources'] if x.get('source')=='sector_fundamentals')
          assert sector['status']=='DATA_QUALITY_WARN' and sector['rows']==0 and sector['observed_rows']==966
          assert c['sources_total']==36 and c['available']==9 and c['not_connected']==16 and c['quality_warn']==6 and c['blocked']==5
          assert a['factor_groups']==35 and a['fully_available_schema_groups']==0
          assert a['partial_source_coverage']==23 and a['not_connected']==12
          assert a['source_coverage_as_of']==c['as_of_utc']
          assert p['recommended_first_source_group']=='market_microstructure'
          assert base['nse_snapshot']['snapshot_id']=='1f6d79d9bcdf3a6aa11dd9a80033276061447401dac6c708ab6622b6258b7534'
          assert base['factor_source_snapshot']['run_id']==41576764331
          assert sector['selected_path']==''
          print(json.dumps({'source_group_status':sector['status'],'observed_rows':sector['observed_rows'],
            'hard_gate_rows':sector['rows'],'factor_groups':a['factor_groups'],
            'fully_available':a['fully_available_schema_groups'],'partial_factors':a['partial_source_coverage'],
            'not_connected_factors':a['not_connected'],'next_source_priority':p['recommended_first_source_group'],
            'hard_gate':'BLOCKED'},indent=2))
          def sha(path):
            h=hashlib.sha256()
            with open(path,'rb') as f:
              for b in iter(lambda:f.read(1048576),b''): h.update(b)
            return h.hexdigest()
          manifest={'status':'PARTIAL_EVIDENCE_RECONCILED_NO_FACTOR_PROMOTION',
            'factor_baseline_run_id':41585579135,'factor_baseline_artifact_id':13207244042,
            'sector_iip_run_id':41588832612,'sector_iip_artifact_id':13208982532,
            'nse_snapshot_id':base['nse_snapshot']['snapshot_id'],
            'source_coverage_as_of_utc':c['as_of_utc'],
            'source_coverage_sha256':sha(root/'source_coverage.json'),
            'factor_coverage_audit_sha256':sha(root/'factor_coverage_audit.json'),
            'factor_gap_priority_sha256':sha(root/'factor_gap_priority_audit.json'),
            'sector_fundamentals_sha256':sha('data/external/sector_fundamentals.csv'),
            'production_invariants':{'selector_changed':False,'ranking_score_changed':False,'pressure_fade_changed':False,'diagnostics_672_changed':False},
            'promotion_allowed':False}
          (root/'sector_fundamentals_factor_registry_manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Upload updated source coverage and Factor Registry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-fundamentals-factor-registry-partial-reconciliation
          path: |
            data/external/sector_fundamentals.csv
            outputs/macro_geo/source_coverage.json
            outputs/macro_geo/factor_coverage_audit.csv
            outputs/macro_geo/factor_coverage_audit.json
            outputs/macro_geo/factor_gap_priority_audit.csv
            outputs/macro_geo/factor_gap_priority_audit.json
            outputs/macro_geo/sector_fundamentals_iip_adapter_qa.json
            outputs/macro_geo/sector_fundamentals_source_coverage_reconciliation.json
            outputs/macro_geo/sector_fundamentals_factor_registry_manifest.json
            outputs/macro_geo/nse_factor_registry_evidence_manifest.json
          if-no-files-found: warn
          retention-days: 90
