name: Global Capital Rotation Overlay QA

on:
  push:
    branches:
      - research/global-capital-rotation-overlay-mainline-20261113
    paths:
      - "pipeline/global_capital_rotation_overlay.py"
      - "config/global_capital_rotation_source_registry.json"
      - "qa/test_global_capital_rotation_overlay.py"
      - "data/global_capital_rotation/**"
      - "docs/GLOBAL_CAPITAL_ROTATION_OFFICIAL_SOURCE_REGISTER_V1.md"
      - ".github/workflows/global-capital-rotation-qa.yml"

permissions:
  contents: read

jobs:
  overlay-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile overlay parser and tests
        run: python -m py_compile pipeline/global_capital_rotation_overlay.py qa/test_global_capital_rotation_overlay.py
      - name: Run focused overlay regression suite
        run: python -m unittest qa.test_global_capital_rotation_overlay -v
