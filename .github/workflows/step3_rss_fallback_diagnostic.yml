name: Step 3 RSS Fallback Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [audit/prospective-selector-tracking]
    paths:
      - ".github/workflows/step3_rss_fallback_diagnostic.yml"
      - "pipeline/stock_news_24h_collect.py"
      - "qa/test_stock_news_rss_fallback.py"

permissions:
  contents: read

concurrency:
  group: step3-rss-fallback-diagnostic
  cancel-in-progress: false

jobs:
  mocked-fallback-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/prospective-selector-tracking
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal collector dependencies
        run: python -m pip install pandas requests
      - name: Test mocked 429, timeout, RSS XML, timestamps, URLs and schemas
        run: python -m unittest -v qa.test_stock_news_rss_fallback
  live-rss-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/prospective-selector-tracking
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal collector dependencies
        run: python -m pip install pandas requests
      - name: Live Google News RSS endpoint smoke test (one query)
        run: |
          python - <<'PY'
          import requests
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse
          endpoint = "https://news.google.com/rss/search"
          params = {"q": '"RELIANCE" NSE stock after:2026-10-21 before:2026-10-23', "hl": "en-IN", "gl": "IN", "ceid": "IN:en"}
          response = requests.get(endpoint, params=params, timeout=(10, 20), headers={"User-Agent": "Mozilla/5.0 (compatible; PRECISION-WIRES-diagnostic/1.0)"})
          response.raise_for_status()
          root = ET.fromstring(response.content)
          channel = root.find("channel")
          if channel is None:
              raise SystemExit("RSS_SMOKE_FAIL_MISSING_CHANNEL")
          items = channel.findall("item")
          valid = 0
          for item in items:
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").strip()
              pub_date = (item.findtext("pubDate") or "").strip()
              if title and urlparse(link).scheme in ("http", "https") and pub_date:
                  valid += 1
          print({"status": "PASS", "http_status": response.status_code, "xml_channel": True, "items_returned": len(items), "items_with_title_url_pubdate": valid, "query_url": response.url})
          PY
