name: Macro Geo Live Source Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [audit/run93-corrective-fixes]
    paths:
      - "pipeline/macro_geo_live_source_diagnostics.py"
      - "pipeline/macro_geo_collect_p0.py"
      - "qa/test_macro_geo_engine.py"
      - ".github/workflows/macro_geo_live_source_diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: macro-geo-live-diagnostics
  cancel-in-progress: false

jobs:
  live-source-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout corrective audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/run93-corrective-fixes
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run bounded unit tests
        run: python -m unittest qa.test_macro_geo_engine qa.test_macro_geo_repair_p0 -v
      - name: Run limited live GDELT RSS FRED and cached-panel diagnostics
        run: python pipeline/macro_geo_live_source_diagnostics.py
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-geo-live-source-diagnostics
          path: outputs/macro_geo/live_source_diagnostics.json
          if-no-files-found: error
