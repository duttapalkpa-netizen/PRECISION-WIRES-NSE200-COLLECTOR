name: NSE FII-DII Capture Utility Unit Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nse-fii-dii-capture-unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-utility-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout selected workflow branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated runtime dependency
        run: python -m pip install --disable-pip-version-check requests
      - name: Compile capture utility
        run: python -m py_compile tools/research/capture_nse_fii_dii.py
      - name: Run capture utility offline unit tests
        run: python -m unittest discover -s tools/research/tests -p 'test_capture_nse_fii_dii.py' -v
      - name: Run FII-DII mapping contract tests
        run: python -m unittest discover -s tools/research/tests -p 'test_fii_dii_mapping_contract.py' -v
