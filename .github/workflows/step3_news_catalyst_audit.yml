name: Step 3 News and Catalyst Join Audit

on:
  workflow_dispatch:
  push:
    branches: [audit/prospective-selector-tracking]
    paths:
      - ".github/workflows/step3_news_catalyst_audit.yml"
      - "pipeline/stock_news_24h_collect.py"
      - "pipeline/stock_news_24h_join.py"
      - "pipeline/quarterly_results_research.py"
      - "pipeline/quarterly_pdf_xbrl_metrics.py"
      - "qa/test_quarterly_results_research.py"
      - "qa/test_quarterly_pdf_xbrl_metrics.py"

permissions:
  contents: read

concurrency:
  group: step3-news-catalyst-audit
  cancel-in-progress: false

jobs:
  step3-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch only
        uses: actions/checkout@v4
        with:
          ref: audit/prospective-selector-tracking
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild bounded prerequisites on this runner
        env:
          WF_SESSIONS: "100"
          QUARTERLY_METRIC_MAX_DISCLOSURES: "500"
        run: |
          python collector/nse_download.py --sessions 200
          python collector/build_200_sessions.py
          python qa/validate_dataset.py
          python pipeline/quarterly_results_research.py
          python pipeline/quarterly_pdf_xbrl_metrics.py
          python pipeline/quarterly_results_research.py
          python pipeline/walk_forward_backtest.py
          python pipeline/target5_h1_selector_experiment.py
      - name: Rebuild and assert Step 2 source-validation coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          report_path = Path("outputs/quarterly_results/quarterly_results_research_report.json")
          validation_path = Path("outputs/quarterly_results/source_validation_report.csv")
          disclosure_path = Path("data/raw/quarterly_results_disclosures.csv")
          ledger_path = Path("data/raw/quarterly_financial_metrics.csv")
          if not all(p.exists() for p in (report_path, validation_path, disclosure_path, ledger_path)):
              raise SystemExit("STEP3_BLOCKED_STEP2_REQUIRED_SOURCE_ARTIFACT_MISSING")
          manifest = json.loads(report_path.read_text(encoding="utf-8"))
          validation = pd.read_csv(validation_path, dtype=str).fillna("")
          disclosures = pd.read_csv(disclosure_path, dtype=str).fillna("")
          ledger = pd.read_csv(ledger_path, dtype=str).fillna("")
          required_validation = {"EVENT_KIND", "RESULT_DECLARED", "SOURCE_URL", "PUBLICATION_TIMESTAMP", "REPORTING_PERIOD", "SYMBOL", "ISIN", "RECORD_VALID"}
          if not required_validation.issubset(validation.columns):
              raise SystemExit("STEP3_BLOCKED_STEP2_SOURCE_VALIDATION_SCHEMA")
          result_events = validation[
              validation["EVENT_KIND"].astype(str).str.upper().eq("RESULT_DISCLOSURE")
              & validation["RESULT_DECLARED"].astype(str).str.lower().isin(["true", "1"])
          ].copy()
          valid = result_events["RECORD_VALID"].astype(str).str.lower().isin(["true", "1"])
          invalid = result_events.loc[~valid]
          invalid_counts = {}
          for value in invalid.get("MISSING_FIELDS", pd.Series(dtype=str)).astype(str):
              for field in value.split(";"):
                  if field:
                      invalid_counts[field] = invalid_counts.get(field, 0) + 1
          print("STEP2_SOURCE_VALIDATION_DIAGNOSTIC=" + json.dumps({
              "all_validation_rows": int(len(validation)),
              "result_disclosure_rows": int(len(result_events)),
              "valid_result_rows": int(valid.sum()),
              "invalid_result_rows": int((~valid).sum()),
              "invalid_by_missing_fields": invalid_counts,
              "invalid_samples": invalid[["SYMBOL", "ISIN", "PUBLICATION_TIMESTAMP", "REPORTING_PERIOD", "MISSING_FIELDS", "SOURCE_URL"]].head(20).to_dict("records")
          }, sort_keys=True))
          source_pass = len(result_events) > 0 and bool(valid.all())
          if not source_pass:
              raise SystemExit("STEP3_BLOCKED_STEP2_SOURCE_VALIDATION_RESULT_RECORDS")
          required_metrics = {"SYMBOL", "PERIOD_END", "BASIS", "SOURCE_URL", "DISCLOSED_AT", "REVENUE", "PAT", "EPS", "EXTRACTION_STATUS"}
          if not required_metrics.issubset(ledger.columns):
              raise SystemExit("STEP3_BLOCKED_STEP2_METRIC_LEDGER_SCHEMA")
          verified = ledger[ledger["EXTRACTION_STATUS"].eq("SOURCE_LINKED_XBRL_FACTS")].copy()
          blocked_rows = int(ledger["EXTRACTION_STATUS"].astype(str).str.startswith("BLOCKED").sum())
          disclosure_rows = len(disclosures)
          complete = disclosure_rows > 0 and len(ledger) == disclosure_rows and blocked_rows == 0 and len(verified) > 0
          if not complete:
              raise SystemExit("STEP3_BLOCKED_STEP2_FINANCIAL_METRIC_COVERAGE:" + json.dumps({
                  "ledger_rows": len(ledger), "disclosure_rows": disclosure_rows,
                  "blocked_rows": blocked_rows, "verified_rows": len(verified)}, sort_keys=True))
          normalized = Path("data/raw/quarterly_financial_metrics_verified.csv")
          verified[["SYMBOL", "PERIOD_END", "BASIS", "SOURCE_URL", "DISCLOSED_AT", "REVENUE", "PAT", "EPS"]].to_csv(normalized, index=False)
          from pipeline.quarterly_results_research import build_financial_features, OUT
          features, feature_report = build_financial_features(normalized)
          OUT.mkdir(parents=True, exist_ok=True)
          features.to_csv(OUT / "quarterly_financial_features.csv", index=False)
          manifest["source_validation"] = {
              "status": "PASS", "records_checked": int(len(validation)),
              "valid_records": int(valid.sum()), "invalid_records": int((~valid).sum()),
              "report_file": str(validation_path)
          }
          manifest["financial_metrics"] = {
              **feature_report,
              "coverage": {"status": "PASS", "verified_metric_rows": int(len(verified)),
                           "ledger_rows_evaluated": int(len(ledger)),
                           "disclosure_rows_in_current_source": int(disclosure_rows),
                           "blocked_rows": blocked_rows, "coverage_scope": "full current disclosure set"},
              "provenance_source": str(normalized)
          }
          manifest["step_2_status"] = "PASS"
          report_path.write_text(json.dumps(manifest, indent=2, allow_nan=False), encoding="utf-8")
          print("STEP2_SOURCE_VALIDATION_AND_METRIC_COVERAGE=PASS " + json.dumps({
              "source_validation_rows": len(validation), "verified_metric_rows": len(verified),
              "ledger_rows": len(ledger), "disclosure_rows": disclosure_rows,
              "blocked_rows": blocked_rows}, sort_keys=True))
          PY
      - name: Verify prerequisite candidate and quarterly evidence files
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
            Path("outputs/prospective/target5_h1_selector_experiment_picks.csv"),
            Path("data/raw/quarterly_results_disclosures.csv"),
            Path("outputs/quarterly_results/quarterly_financial_features.csv"),
            Path("outputs/quarterly_results/quarterly_results_research_report.json"),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit("STEP3_BLOCKED_MISSING_PREREQUISITES: " + ", ".join(missing))
          print("STEP3_PREREQUISITES_PRESENT")
          PY
      - name: Join point-in-time quarterly results to frozen candidates
        run: python pipeline/quarterly_results_candidate_join.py
      - name: Scope discovery to latest historical cutoff without changing selectors
        run: |
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p = Path("outputs/prospective/target5_h1_selector_experiment_picks.csv")
          df = pd.read_csv(p, dtype={"SYMBOL": str})
          if not {"CUT_OFF", "SYMBOL"}.issubset(df.columns):
              raise SystemExit("STEP3_BLOCKED_BAD_CANDIDATE_SCHEMA")
          df["CUT_OFF"] = pd.to_datetime(df["CUT_OFF"], errors="coerce")
          df = df.dropna(subset=["CUT_OFF"])
          if df.empty:
              raise SystemExit("STEP3_BLOCKED_NO_VALID_CUTOFFS")
          latest = df["CUT_OFF"].max()
          df = df[df["CUT_OFF"].eq(latest)].copy()
          if df.empty:
              raise SystemExit("STEP3_BLOCKED_LATEST_CUTOFF_EMPTY")
          df.to_csv(p, index=False)
          print(f"STEP3_SCOPED_CUTOFF={latest.date().isoformat()} PAIRS={len(df[['CUT_OFF','SYMBOL']].drop_duplicates())}")
          PY
      - name: Collect timestamped 24-hour stock-news discovery for latest cutoff only
        run: python pipeline/stock_news_24h_collect.py
      - name: Build stock-specific 24-hour timestamp-aligned news join
        run: python pipeline/stock_news_24h_join.py
      - name: Enforce evidence-based Step 3 status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          report_path = Path("outputs/news_24h/stock_news_24h_readiness.json")
          collect_path = Path("outputs/news_24h/stock_news_collection_report.json")
          coverage_path = Path("data/raw/stock_news_coverage.csv")
          join_path = Path("outputs/news_24h/stock_news_24h_cutoff_join.csv")
          quarter_path = Path("outputs/quarterly_results/target5_h1_quarterly_catalyst_join_report.json")
          for p in (report_path, collect_path, coverage_path, join_path, quarter_path):
              if not p.exists():
                  raise SystemExit("STEP3_BLOCKED_REPORT_MISSING: " + str(p))
          news = json.loads(report_path.read_text())
          collection = json.loads(collect_path.read_text())
          quarterly = json.loads(quarter_path.read_text())
          coverage = pd.read_csv(coverage_path, dtype={"SYMBOL": str, "CUT_OFF": str})
          joined = pd.read_csv(join_path, dtype={"SYMBOL": str, "CUT_OFF": str})
          candidates = pd.read_csv("outputs/prospective/target5_h1_selector_experiment_picks.csv", dtype={"SYMBOL": str})
          quarterly_report = json.loads(Path("outputs/quarterly_results/quarterly_results_research_report.json").read_text())
          print("STEP3_NEWS_JOIN=" + json.dumps(news, sort_keys=True))
          print("STEP3_NEWS_COLLECTION=" + json.dumps(collection, sort_keys=True))
          print("STEP3_QUARTERLY_JOIN=" + json.dumps(quarterly, sort_keys=True))
          coverage["COVERAGE_STATUS"] = coverage["COVERAGE_STATUS"].astype(str).str.upper().str.strip()
          unknown = int((coverage["COVERAGE_STATUS"] != "COMPLETE").sum())
          if coverage.empty or unknown:
              raise SystemExit(f"STEP3_BLOCKED_INCOMPLETE_NEWS_SOURCE_COVERAGE: unknown={unknown}, total={len(coverage)}")
          required_join = {"CUT_OFF", "SYMBOL", "CUTOFF_AT", "WINDOW_START", "SOURCE_QUERY_URL",
                           "SOURCE_QUERY_URL_VALID", "COVERAGE_STATUS", "NEWS_STATUS",
                           "LATEST_PUBLISHED_AT", "LATEST_CANONICAL_URL", "SYMBOL_CUTOFF_MATCH",
                           "TIMESTAMP_WINDOW_VALID"}
          missing_join = sorted(required_join - set(joined.columns))
          if missing_join:
              raise SystemExit("STEP3_BLOCKED_JOIN_EVIDENCE_FIELDS_MISSING: " + ",".join(missing_join))
          if len(joined) != len(coverage) or len(joined) != len(candidates[["CUT_OFF", "SYMBOL"]].drop_duplicates()):
              raise SystemExit(f"STEP3_BLOCKED_JOIN_CARDINALITY_MISMATCH: joined={len(joined)}, coverage={len(coverage)}")
          pair_cols = ["CUT_OFF", "SYMBOL"]
          expected_pairs = set(map(tuple, candidates[pair_cols].astype(str).drop_duplicates().values.tolist()))
          joined_pairs = set(map(tuple, joined[pair_cols].astype(str).drop_duplicates().values.tolist()))
          coverage_pairs = set(map(tuple, coverage[pair_cols].astype(str).drop_duplicates().values.tolist()))
          if expected_pairs != joined_pairs or expected_pairs != coverage_pairs:
              raise SystemExit("STEP3_BLOCKED_CUTOFF_SYMBOL_PAIR_MISMATCH")
          if joined.duplicated(pair_cols).any() or coverage.duplicated(pair_cols).any():
              raise SystemExit("STEP3_BLOCKED_DUPLICATE_CUTOFF_SYMBOL_PAIRS")
          if not joined["NEWS_STATUS"].isin(["NO_MATCH_IN_GDELT_QUERY_WINDOW", "UNVERIFIED_NEWS_PRESENT", "VERIFIED_NEWS_PRESENT"]).all():
              raise SystemExit("STEP3_BLOCKED_INVALID_NEWS_STATUS_OR_TIMESTAMP_ALIGNMENT")
          if not joined["SOURCE_QUERY_URL_VALID"].astype(str).str.lower().isin(["true", "1"]).all():
              raise SystemExit("STEP3_BLOCKED_INVALID_QUERY_SOURCE_URL")
          if not joined["SYMBOL_CUTOFF_MATCH"].astype(str).str.lower().isin(["true", "1"]).all():
              raise SystemExit("STEP3_BLOCKED_SYMBOL_CUTOFF_ALIGNMENT")
          if not joined["TIMESTAMP_WINDOW_VALID"].astype(str).str.lower().isin(["true", "1"]).all():
              raise SystemExit("STEP3_BLOCKED_TIMESTAMP_WINDOW_ALIGNMENT")
          has_news = joined["NEWS_ITEMS_24H"].fillna(0).astype(int).gt(0)
          article_url_valid = joined.loc[has_news, "LATEST_CANONICAL_URL"].astype(str).str.match(r"^https?://[^\s]+$", case=False)
          if not article_url_valid.all():
              raise SystemExit("STEP3_BLOCKED_INVALID_ARTICLE_SOURCE_URL")
          source_validation = quarterly_report.get("source_validation", {})
          financial_metrics = quarterly_report.get("financial_metrics", {})
          metric_coverage = financial_metrics.get("coverage", {})
          if quarterly_report.get("step_2_status") != "PASS" or source_validation.get("status") != "PASS" or metric_coverage.get("status") != "PASS":
              raise SystemExit("STEP3_BLOCKED_STEP2_SOURCE_VALIDATION_OR_FINANCIAL_METRIC_COVERAGE")
          if quarterly.get("status") != "COMPUTED_AUDIT_JOIN" or quarterly.get("quarterly_source_status") != "AVAILABLE":
              raise SystemExit("STEP3_BLOCKED_QUARTERLY_SOURCE_COVERAGE")
          report = {
              "step": 3,
              "status": "PASS_NEWS_CATALYST_JOIN_COVERAGE_AND_TIMESTAMP_ALIGNMENT",
              "coverage_rows": int(len(coverage)),
              "coverage_unknown_rows": unknown,
              "timestamp_join_rows": int(len(joined)),
              "quarterly_catalyst_join_rows": int(quarterly.get("rows", 0)),
              "step_2_source_validation_status": source_validation.get("status", "UNKNOWN"),
              "step_2_financial_metric_coverage_status": metric_coverage.get("status", "UNKNOWN"),
              "cutoff_symbol_pair_match": True,
              "source_query_urls_valid": True,
              "article_source_urls_valid_for_present_news": True,
              "timestamp_window_alignment": True,
              "paired_news_ablation_status": "BLOCKED_UNTIL_RELEVANT_NEWS_IS_INDEPENDENTLY_VERIFIED",
              "source_scope_limit": "COMPLETE means the queried GDELT source/window responded successfully; it does not prove no news exists elsewhere.",
              "production_selector_changed": False,
              "ranking_score_changed": False,
              "pressure_fade_changed": False
          }
          Path("outputs/news_24h/step3_completion_verdict.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print("STEP3_COMPLETION_VERDICT=" + json.dumps(report, sort_keys=True))
          PY
      - name: Upload Step 3 evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: step3-news-catalyst-join-audit
          if-no-files-found: warn
          path: |
            data/qa/qa_report.json
            outputs/backtest/walk_forward_metrics.json
            outputs/prospective/target5_h1_selector_experiment.json
            outputs/news_24h/stock_news_collection_report.json
            outputs/news_24h/stock_news_24h_readiness.json
            outputs/news_24h/stock_news_24h_cutoff_join.csv
            outputs/news_24h/step3_completion_verdict.json
            data/raw/stock_news_events.csv
            data/raw/stock_news_coverage.csv
            outputs/quarterly_results/target5_h1_quarterly_catalyst_join.csv
            outputs/quarterly_results/target5_h1_quarterly_catalyst_join_report.json
            outputs/quarterly_results/quarterly_results_research_report.json
            outputs/quarterly_results/filing_metric_extraction_report.json
