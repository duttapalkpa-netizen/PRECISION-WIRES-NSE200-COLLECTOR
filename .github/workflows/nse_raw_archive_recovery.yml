name: NSE Raw Archive Missing-Session Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/nse_raw_archive_recovery.yml"
      - "collector/nse_download.py"
      - "scripts/research/merge_raw_archive_shards.py"
      - "scripts/research/build_raw_archive_manifest.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  acquire-missing-early-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector dependencies
        run: python -m pip install -r requirements.txt
      - name: Acquire earliest missing window from official NSE
        run: |
          python collector/nse_download.py \
            --start-date "2026-01-21" \
            --end-date "2026-02-08" \
            --out data/raw
      - name: Upload recovered early shard
        uses: actions/upload-artifact@v4
        with:
          name: nse-raw-shard-00-recovery
          path: data/raw/
          if-no-files-found: error
          retention-days: 90

  merge-and-audit:
    needs: acquire-missing-early-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download original 20 successful shard artifacts from run 43733753079
        uses: actions/download-artifact@v4
        with:
          pattern: nse-raw-shard-*
          path: artifacts/previous-shards
          merge-multiple: false
          run-id: 43733753079
          github-token: ${{ github.token }}
      - name: Download recovered early shard from this run
        uses: actions/download-artifact@v4
        with:
          name: nse-raw-shard-00-recovery
          path: artifacts/recovered-shard-00
      - name: Assemble 21 source folders and require exactly 200 unique sessions
        run: |
          mkdir -p artifacts/all-shards
          cp -a artifacts/previous-shards/. artifacts/all-shards/
          mkdir -p artifacts/all-shards/nse-raw-shard-00
          cp -a artifacts/recovered-shard-00/. artifacts/all-shards/nse-raw-shard-00/
          python scripts/research/merge_raw_archive_shards.py \
            --input-root artifacts/all-shards \
            --output-root data/raw \
            --expected-sessions 200
      - name: Upload final raw archive and SHA-256 manifest
        uses: actions/upload-artifact@v4
        with:
          name: nse-200-session-raw-archive-recovered-${{ github.run_number }}
          path: |
            data/raw/
            data/qa/raw_archive_manifest.json
          if-no-files-found: error
          retention-days: 90
