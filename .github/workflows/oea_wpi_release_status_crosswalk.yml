name: OEA WPI Release Status Crosswalk QA
on:
  push:
    branches: [fix/factor-registry-same-snapshot-reconcile]
    paths:
      - "pipeline/collect_oea_wpi_itemwise.py"
      - "pipeline/verify_oea_tls_chain.py"
      - "pipeline/build_oea_wpi_release_status_crosswalk.py"
      - "pipeline/audit_oea_wpi_factor_registry_eligibility.py"
      - "pipeline/build_oea_wpi_inflation_components_adapter.py"
      - "pipeline/audit_factor_registry_same_snapshot.py"
      - "pipeline/recheck_f14_eligibility_after_coverage.py"
      - "data/reference/oea_wpi_release_status_evidence.json"
      - "qa/test_oea_wpi_itemwise.py"
      - "qa/test_oea_wpi_release_status_crosswalk.py"
      - "qa/test_oea_wpi_factor_registry_eligibility.py"
      - "qa/test_oea_wpi_inflation_components_adapter.py"
      - ".github/workflows/oea_wpi_release_status_crosswalk.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: oea-wpi-release-status-crosswalk
  cancel-in-progress: false
jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workbook reader
        run: python -m pip install openpyxl certifi pandas
      - name: Run WPI and adapter guardrail tests
        run: python -m unittest qa.test_oea_wpi_itemwise qa.test_oea_wpi_release_status_crosswalk qa.test_oea_wpi_factor_registry_eligibility qa.test_oea_wpi_inflation_components_adapter -v
      - name: Verify official OEA TLS chain and retrieve WPI workbook
        run: |
          python pipeline/verify_oea_tls_chain.py
          python pipeline/collect_oea_wpi_itemwise.py
      - name: Build official revision-status crosswalk
        run: python pipeline/build_oea_wpi_release_status_crosswalk.py
      - name: Build full-schema inflation_components adapter
        run: python pipeline/build_oea_wpi_inflation_components_adapter.py
      - name: Retrieve exact successful Factor Source Repair snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_REPAIR_RUN_ID: '41278895821'
        run: |
          set -euo pipefail
          META=$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_REPAIR_RUN_ID")
          echo "$META" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("conclusion")=="success"; assert d.get("path")==".github/workflows/macro_geo_factor_source_repair.yml"; assert d.get("head_branch")=="audit/run145-factor-registry-gap-audit"; assert d.get("head_sha")=="172d0950b3323c39a6cb4151d3194a6f8e8ffdc6"; print({"run_id":d["id"],"head_sha":d["head_sha"],"snapshot":"validated"})'
          mkdir -p /tmp/factor-evidence
          gh run download "$SOURCE_REPAIR_RUN_ID" -n macro-geo-factor-source-repair -D /tmp/factor-evidence
          test -s /tmp/factor-evidence/outputs/macro_geo/source_coverage.json
          test -s /tmp/factor-evidence/outputs/macro_geo/factor_source_collection_report.json
          cp -a /tmp/factor-evidence/. .
      - name: Run same-snapshot Factor Registry coverage audit
        run: python pipeline/audit_factor_registry_same_snapshot.py
      - name: Recheck F14 eligibility after coverage audit
        run: python pipeline/recheck_f14_eligibility_after_coverage.py
      - name: Retain prior WPI eligibility guardrail audit
        run: python pipeline/audit_oea_wpi_factor_registry_eligibility.py
      - name: Verify source and output hashes and hard gates
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("artifacts/macro_full_history_discovery")
          m=json.loads((p/"oea_wpi_itemwise_manifest.json").read_text())
          r=json.loads((p/"oea_wpi_release_status_crosswalk.json").read_text())
          e=json.loads((p/"oea_wpi_factor_registry_eligibility_audit.json").read_text())
          a=json.loads((p/"oea_wpi_inflation_components_adapter.json").read_text())
          c=json.loads((p/"factor_registry_same_snapshot_coverage_audit.json").read_text())
          f=json.loads((p/"f14_eligibility_recheck.json").read_text())
          for file,digest in [
            (p/m["source"]["raw_file"],m["source"]["raw_sha256"]),
            (p/m["normalized_csv"]["file"],m["normalized_csv"]["sha256"]),
            (p/"oea_wpi_release_status_crosswalk.csv",r["crosswalk_csv_sha256"]),
            (p/"inflation_components.csv",a["rows_sha256"])
          ]:
            assert hashlib.sha256(file.read_bytes()).hexdigest()==digest
          assert r["status"]=="WPI_RELEASE_STATUS_CROSSWALK_PASS"
          assert r["status_counts"]["FINAL"]==4
          assert r["status_counts"]["PROVISIONAL"]==2
          assert r["october_2026"]["status"]=="NOT_YET_RELEASED_AS_OF_2026-11-01"
          assert r["october_2026"]["observation_rows"]==0
          assert e["status"]=="WPI_FACTOR_REGISTRY_ELIGIBILITY_AUDIT_PASS"
          assert e["promotion_decision"]=="NOT_ELIGIBLE"
          assert a["status"]=="INFLATION_COMPONENTS_ADAPTER_PASS_SCHEMA_COMPLETE"
          assert set(["DATE","COUNTRY","COMPONENT","VALUE","RELEASED_AT","SOURCE","SOURCE_URL","OBSERVED_AT_UTC"]).issubset(set(a["fields"]))
          assert c["status"]=="SAME_SNAPSHOT_FACTOR_COVERAGE_AUDIT_EXECUTED"
          assert c["coverage_snapshot_sha256"] is not None
          assert c["canonical_report_status"] in ["FACTOR_COVERAGE_AUDITED_WITH_GAPS","ALL_MAPPED_SOURCE_GROUPS_SCHEMA_AVAILABLE"]
          assert f["promotion_decision"]=="NOT_ELIGIBLE"
          assert f["factor_registry_change"]=="NONE; F14 mapping and registry remain unchanged"
          assert f["hard_gate"]=="UNCHANGED_BLOCKED_UNTIL_ALL_REQUIRED_P0_AND_FACTOR_EVIDENCE_GATES_PASS"
          print({"crosswalk":r["status"],"adapter":a["status"],"coverage":c["status"],"F14":f["promotion_decision"],"blockers":f["blockers"]})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oea-wpi-release-status-crosswalk
          path: artifacts/macro_full_history_discovery/
          if-no-files-found: warn
