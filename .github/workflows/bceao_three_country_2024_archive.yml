name: BCEAO three-country 2024 BOP raw source archive
on:
  push:
    paths:
      - "scripts/research/archive_bceao_three_country_2024.py"
      - "scripts/research/bceao_three_country_2024_trigger.txt"
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire BEN BFA SEN official PDFs
        run: python scripts/research/archive_bceao_three_country_2024.py
      - name: Upload raw PDFs and manifests
        uses: actions/upload-artifact@v4
        with:
          name: bceao-ben-bfa-sen-bop-2024-raw
          path: bceao_three_country_2024_raw/
          if-no-files-found: error
          retention-days: 90
